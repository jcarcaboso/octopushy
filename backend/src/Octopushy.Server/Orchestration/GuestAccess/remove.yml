---
# Removes keys of Octopushy's own, as the guest's OpenSSH reads each line. A person's key is not
# chosen by this, whatever its comment or options say. The one way to lose one is a write in the
# instant before the file is replaced: authorized_keys.py states that limit.
- name: Remove the old controller-owned key
  hosts: all
  gather_facts: false
  tasks:
    - name: Remove exactly these keys
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/authorized_keys.py remove {{ access_kept_key | quote }} {{ access_removed_keys | map('quote') | join(' ') }}"
        executable: /usr/bin/python3
      register: access_removed
      changed_when: "'changed' in access_removed.stdout"
