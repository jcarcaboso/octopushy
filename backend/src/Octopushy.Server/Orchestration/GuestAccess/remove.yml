---
# Removes exact keys of Octopushy's own, read from the field sshd reads them from. A person's key
# cannot be caught by this, whatever its comment or options say.
- name: Remove the old controller-owned key
  hosts: all
  gather_facts: false
  tasks:
    - name: Remove exactly these keys
      ansible.builtin.script:
        cmd: "{{ playbook_dir }}/authorized_keys.py remove {{ access_removed_keys | map('quote') | join(' ') }}"
        executable: /usr/bin/python3
      register: access_removed
      changed_when: "'changed' in access_removed.stdout"
