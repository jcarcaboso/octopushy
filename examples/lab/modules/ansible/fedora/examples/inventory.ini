# Inactive example. Use a fresh VM, a dedicated SSH key, and pinned known_hosts.
[fedora]
service-vm ansible_host=192.0.2.10 ansible_user=ops

[fedora:vars]
ansible_ssh_private_key_file=/path/to/private-key
ansible_ssh_common_args='-o StrictHostKeyChecking=yes -o UserKnownHostsFile=/path/to/verified-known-hosts'
