---
- name: Choose where things go
  ansible.builtin.set_fact:
    victoriametrics_base: /opt/victoria-metrics
    victoriametrics_config: /etc/victoria-metrics
    victoriametrics_data: /var/lib/victoria-metrics
    victoriametrics_port: "{{ octopushy.ports | map(attribute='port') | first | default(8428) }}"
    victoriametrics_release: "/opt/victoria-metrics/v{{ victoriametrics_version }}"
    victoriametrics_days: {d: 1, w: 7, y: 365}

# systemd takes a quoted value as it is, as long as the quote does not appear in it.
- name: Check that the password can be written down
  vars:
    victoriametrics_backslash: "\\"
  ansible.builtin.assert:
    that:
      - victoriametrics_password | length >= 16
      - >-
        "'" not in victoriametrics_password and victoriametrics_backslash not in victoriametrics_password
        and '\n' not in victoriametrics_password
    fail_msg: The password needs 16 characters or more, with no quote, backslash or newline.
  no_log: true

- name: Check the architecture
  ansible.builtin.command:
    argv: [dpkg, --print-architecture]
  register: victoriametrics_architecture
  changed_when: false
  failed_when: victoriametrics_architecture.stdout != 'amd64'

- name: Make the user
  ansible.builtin.user:
    name: victoriametrics
    system: true
    create_home: false
    shell: /usr/sbin/nologin

- name: Make the data directory
  ansible.builtin.file:
    path: "{{ victoriametrics_data }}"
    state: directory
    owner: victoriametrics
    group: victoriametrics
    mode: "0700"

- name: Make the other directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: ["{{ victoriametrics_config }}", "{{ victoriametrics_base }}"]

- name: Read the retention in force
  ansible.builtin.slurp:
    src: "{{ victoriametrics_config }}/retention"
  register: victoriametrics_current
  failed_when: false

- name: Refuse to shorten retention here
  vars:
    victoriametrics_was: "{{ (victoriametrics_current.content | b64decode | trim) if 'content' in victoriametrics_current else '' }}"
    victoriametrics_new_days: "{{ victoriametrics_retention[:-1] | int * victoriametrics_days[victoriametrics_retention[-1]] }}"
    victoriametrics_old_days: "{{ (victoriametrics_was[:-1] | int * victoriametrics_days[victoriametrics_was[-1]]) if victoriametrics_was else 0 }}"
  ansible.builtin.assert:
    that: victoriametrics_allow_shrink or (victoriametrics_new_days | int) >= (victoriametrics_old_days | int)
    fail_msg: >-
      Retention would go from {{ victoriametrics_was }} to {{ victoriametrics_retention }}, and VictoriaMetrics
      would discard what is older. Nothing changed. Run the shrink-retention action to do that on purpose.

- name: See whether this release is here
  ansible.builtin.stat:
    path: "{{ victoriametrics_release }}/victoria-metrics-prod"
  register: victoriametrics_installed

- name: Download and unpack the release
  when: not (victoriametrics_installed.stat.executable | default(false))
  block:
    - name: Make a download directory
      ansible.builtin.tempfile:
        state: directory
        path: /var/tmp
        prefix: victoria-metrics
      register: victoriametrics_download
    - name: Download, checked against the pin
      ansible.builtin.get_url:
        url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ victoriametrics_version }}/victoria-metrics-linux-amd64-v{{ victoriametrics_version }}.tar.gz"
        dest: "{{ victoriametrics_download.path }}/release.tar.gz"
        checksum: "sha256:{{ victoriametrics_sha256 }}"
        mode: "0600"
    - name: Unpack beside where it goes
      ansible.builtin.file:
        path: "{{ victoriametrics_release }}.partial"
        state: directory
        mode: "0755"
    - name: Unpack
      ansible.builtin.unarchive:
        src: "{{ victoriametrics_download.path }}/release.tar.gz"
        dest: "{{ victoriametrics_release }}.partial"
        remote_src: true
        include: [victoria-metrics-prod]
        owner: root
        group: root
        mode: "0755"
    # It appears only when it is complete.
    - name: Move it into place
      ansible.builtin.command:
        argv: [mv, -T, "{{ victoriametrics_release }}.partial", "{{ victoriametrics_release }}"]
      changed_when: true
  always:
    - name: Remove the download
      ansible.builtin.file:
        path: "{{ victoriametrics_download.path }}"
        state: absent
      when: victoriametrics_download.path is defined

- name: Point at this release
  ansible.builtin.file:
    src: "{{ victoriametrics_release }}"
    dest: "{{ victoriametrics_base }}/current"
    state: link
  notify: Restart VictoriaMetrics

- name: Write what to keep
  ansible.builtin.template:
    src: relabel.yaml.j2
    dest: "{{ victoriametrics_config }}/relabel.yaml"
    mode: "0644"
  notify: Restart VictoriaMetrics

# systemd reads this as root and shows only its name, and VictoriaMetrics takes the credentials from
# the environment. Nobody but root can read the file.
- name: Write the credentials
  ansible.builtin.copy:
    content: |
      httpAuth_username={{ victoriametrics_username }}
      httpAuth_password='{{ victoriametrics_password }}'
    dest: "{{ victoriametrics_config }}/auth.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart VictoriaMetrics

- name: Write the unit
  ansible.builtin.template:
    src: victoria-metrics.service.j2
    dest: /etc/systemd/system/victoria-metrics.service
    mode: "0644"
  notify: Restart VictoriaMetrics

- name: Run VictoriaMetrics
  ansible.builtin.systemd_service:
    name: victoria-metrics
    enabled: true
    state: started
    daemon_reload: true

- name: Apply what changed
  ansible.builtin.meta: flush_handlers

- name: Check that it answers
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ victoriametrics_port }}/health"
  register: victoriametrics_health
  until: victoriametrics_health.status == 200
  retries: 60
  delay: 1

# Only once it answers, so that a run that failed before this still sees the old value.
- name: Record the retention in force
  ansible.builtin.copy:
    content: "{{ victoriametrics_retention }}\n"
    dest: "{{ victoriametrics_config }}/retention"
    mode: "0644"

# /health is the one path VictoriaMetrics leaves open, as a liveness check needs to be.
- name: Check that nothing answers without the password
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ victoriametrics_port }}/{{ item }}"
    status_code: 401
  loop: ["api/v1/query?query=1", "api/v1/labels", "write?db=check"]

- name: Check that a wrong password is refused
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ victoriametrics_port }}/api/v1/query?query=1"
    url_username: "{{ victoriametrics_username }}"
    url_password: not-the-password-0123456789
    force_basic_auth: true
    status_code: 401

- name: Check that the password works
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ victoriametrics_port }}/api/v1/query?query=1"
    url_username: "{{ victoriametrics_username }}"
    url_password: "{{ victoriametrics_password }}"
    force_basic_auth: true
  no_log: true

- name: Find older releases
  ansible.builtin.find:
    paths: "{{ victoriametrics_base }}"
    file_type: directory
    patterns: "v*"
    excludes: "v{{ victoriametrics_version }}"
  register: victoriametrics_older

- name: Remove them, now that this one answers
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ victoriametrics_older.files }}"
  loop_control:
    label: "{{ item.path }}"
