schemaVersion: 1
type: container
lifecycle: active                 # active | retired
stateful: true                    # holds data that exists nowhere else; see docs/lxc-recipes.md
host: ziost
vmid: 102
template: debian-13-lxc
hardware:
  cores: 2
  memory: 1024
  swap: 256
  disks:
    - { size: 32, datastore: vm-ssd }   # the root disk, which holds the data
network:
  bridge: apps
  mode: static
  address: 10.15.30.40/24
  gateway: 10.15.30.1
provision:
  recipe: proxmox-lxc
  inputs:
    startup: { order: 1, upDelay: 30 }  # before Home Assistant, which waits 30 seconds for it
setup:
  recipe: debian-base             # what the machine needs; PostgreSQL and VictoriaMetrics are services/
access:
  user: root                      # the login a container has; docs/services.md says how it gets one
  sshKey: { store: ha-db/ssh-key }
  hostKey: { store: ha-db/host-key }
  sshAuthorizedKeys:              # Proxmox writes this when it creates the container, and only then
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyReplaceMeWithYourOwnPublicKey00 octopushy@ha-db
policy:
  destructive: manual             # deleting this container waits for approval, once stateful is taken out
