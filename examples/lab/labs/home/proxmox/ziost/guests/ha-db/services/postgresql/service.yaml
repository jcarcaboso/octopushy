schemaVersion: 1
description: The recorder's database for Home Assistant.
deploy:
  recipe: postgresql
  inputs:
    postgresql_version: 17
    postgresql_database: homeassistant
    postgresql_role: homeassistant
    postgresql_settings:          # sized for a 1024 MiB container that also runs VictoriaMetrics
      max_connections: "20"
      shared_buffers: 192MB
      effective_cache_size: 512MB
      work_mem: 8MB
      maintenance_work_mem: 64MB
      random_page_cost: "1.1"
      wal_compression: "on"
    postgresql_dump_hour: 5       # after Home Assistant's purge at 04:12
    postgresql_dump_minute: 15
    credentials_revision: 1       # raise it, with a new store version, to roll the password
  secrets:                        # made by the operator; Octopushy never shows it again
    postgresql_password: { store: ha-db/postgres-password }
ports:
  - { port: 5432, protocol: tcp, sources: [10.15.40.10] }   # Home Assistant; pg_hba.conf is written from this
policy:
  destructive: manual
