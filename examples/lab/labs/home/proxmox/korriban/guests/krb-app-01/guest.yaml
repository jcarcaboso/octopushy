schemaVersion: 1
type: vm
lifecycle: active                 # active | retired
host: korriban
vmid: 310
template: fedora-44
hardware:
  cores: 2
  memory: 4096
  disks:
    - { size: 32 }                # system disk; datastore from the host
network:
  bridge: vmbr0
  mode: static
  address: 10.1.0.31/24
  gateway: 10.1.0.1
  dns: [10.1.0.1]
workflow: machine-tools@1         # newest 1.x of workflows/machine-tools; @1.0 would stay on exactly 1.0
inputs:                           # given to every stage of the workflow, checked by its inputs schema
  machine_tools_channel: stable
secrets:                          # extra var -> variable store key; only the playbook gets these
  machine_tools_token: { store: proxmox/korriban/krb-app-01/machine_tools_token }
schedules:                        # actions of the workflow, at times in the lab's timezone
  - { action: update-tools, cron: "0 6 * * *" }
access:
  sshAuthorizedKeys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyReplaceMeWithYourOwnPublicKey00 ops@example
  user: ops
  sshKey: { store: proxmox/korriban/krb-app-01/ssh-key }     # a secret: the private half of the key above
  hostKey: { store: proxmox/korriban/krb-app-01/host-key }   # plain: read through Proxmox, never scanned
policy:
  destructive: manual             # deleting this VM waits for approval
