schemaVersion: 1
version: "1.0"                    # M.m, quoted: guests name proxmox-vm@1 (newest 1.x) or proxmox-vm@1.0
manages: vm
description: A VM on a Proxmox host, created from a downloaded cloud image with cloud-init.
inputs: inputs.schema.json        # validates each guest's hardware, network and inputs
stages:
  - name: machine                 # the provision and retire runs
    executor: opentofu
    root: ../../modules/opentofu/proxmox-vm   # an OpenTofu root module, relative to this file
    verify: proxmox               # check the VM through the Proxmox API afterwards
