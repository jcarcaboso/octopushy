name: Images

# Publishes the backend, frontend, agent and validate images to one Docker Hub repository, as
# `<component>-main` and `<component>-sha-<commit>` for every push to main, and
# only `<component>-<version>` for every v<version> tag. The Proxmox
# installer (deploy/proxmox) runs the first three; `validate` is the offline validator,
# `octopushy-validate`, for the CI of lab and workflows repositories. Needs the DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN repository secrets; the token only has to write to this repository.
#
# The Ansible image is published as `ansible-<ansible-core>-<hash>`, from agent/ansible/tag.sh.
# The tag names its content, so a tag that exists is never built again or overwritten.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: backend, file: backend/Containerfile }
          - { component: frontend, file: frontend/Containerfile }
          - { component: agent, file: agent/Containerfile }
          - { component: validate, file: backend/src/Octopushy.Validate/Containerfile }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: docker.io/skorcius/octopushy
          flavor: |
            latest=false
            prefix=${{ matrix.component }}-
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=${{ matrix.component }}-sha-,enable=${{ github.ref_type != 'tag' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  ansible:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: tag
        run: |
          tag=$(sh agent/ansible/tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "docker.io/skorcius/octopushy:$tag" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.tag.outputs.published != 'true'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.tag.outputs.published != 'true'
        with:
          context: .
          file: agent/ansible/Containerfile
          platforms: linux/amd64
          push: true
          tags: docker.io/skorcius/octopushy:${{ steps.tag.outputs.tag }}
