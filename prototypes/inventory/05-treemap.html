<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory · Resource treemap</title>
<!--
  Concept: the lab as a squarified treemap. Area is capacity (memory, cores or disk), so you see
  where the resources go at a glance; colour is liveness, uptime or run status. Hosts are the
  top-level areas, guests the tiles, unallocated capacity the dotted remainder.
  Hash state for testing: #q=fleet  #select=mrb-crt-01  #zoom=moraband  #color=uptime
  #size=cores  #open=moraband  #host=umbrel
-->
<style>
:root {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f6f8fa; --text: #17202b; --muted: #5b6675; --faint: #8a94a3;
  --border: #d9dee6; --border-strong: #b9c1cc; --accent: #2f5bd3; --accent-text: #2f5bd3; --accent-soft: #e4ebfb;
  --up: #1f9d55; --warn: #c98a0b; --down: #d63b3b; --unknown: #8a94a3;
  --up-bg: #d6efdf; --up-bd: #a7d9b9; --warn-bg: #fbeac2; --warn-bd: #ecc66c; --down-bg: #f8d3cf; --down-bd: #eb9b93;
  --unknown-bg: #e4e8ee; --unknown-bd: #c8cfd9; --stripe: rgb(214 59 59 / 14%);
  --run-sync: #dbe5fa; --run-sync-bd: #a9bdf0; --run-pending: #e4e8ee; --run-pending-bd: #c4cbd6;
  --run-failed: #f8d3cf; --run-failed-bd: #eb9b93; --run-await: #eadffb; --run-await-bd: #c6aef0; --run-unc: #f3e8d0; --run-unc-bd: #dcc48f;
  --h0: #fdf3d8; --h1: #fbdc9e; --h2: #f5b46c; --h3: #e9864a; --h4: #d1553a; --h5: #a02f2b;
  --host-bg: #f9fafc; --host-hd: #ffffff; --off-hd: #fbe4e1;
  --um-a: #e7eaef; --um-b: #f3f5f8; --free-dot: #c6cdd7; --free-bg: #f6f8fa;
  --tile-fg: #16202c; --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 4px 14px rgb(16 24 40 / 6%);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1015; --surface: #151a21; --surface-2: #1b2129; --text: #e6ebf2; --muted: #9aa5b4; --faint: #6f7a89;
    --border: #28303b; --border-strong: #3a4452; --accent: #2f5bd3; --accent-text: #8aa6ff; --accent-soft: #1b2847;
    --up: #3ccf7c; --warn: #f0b429; --down: #ff6b61; --unknown: #8a94a3;
    --up-bg: #133824; --up-bd: #1f5a39; --warn-bg: #3b2e0d; --warn-bd: #6b5114; --down-bg: #45191a; --down-bd: #7a2a29;
    --unknown-bg: #232a34; --unknown-bd: #364050; --stripe: rgb(255 107 97 / 13%);
    --run-sync: #1a2847; --run-sync-bd: #2c437a; --run-pending: #252c36; --run-pending-bd: #3a4452;
    --run-failed: #45191a; --run-failed-bd: #7a2a29; --run-await: #2f2147; --run-await-bd: #553a85; --run-unc: #352c18; --run-unc-bd: #5f4e26;
    --h0: #262a25; --h1: #45391c; --h2: #6e4a1b; --h3: #a1591e; --h4: #cc4a2b; --h5: #e8443a;
    --host-bg: #11161c; --host-hd: #161c24; --off-hd: #3a1719;
    --um-a: #1c222a; --um-b: #222932; --free-dot: #333c48; --free-bg: #12171d;
    --tile-fg: #eef2f7; --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 18px rgb(0 0 0 / 30%);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
a { color: var(--accent-text); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

/* header */
.top { display: flex; align-items: center; gap: 24px; padding: 12px 20px 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex: 1 1 auto; }
.brand h1 { margin: 0; font-size: 20px; letter-spacing: -.01em; display: flex; align-items: center; gap: 9px; }
.logo { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-grid; grid-template: 1fr 1fr / 3fr 2fr; gap: 2px; padding: 3px; align-self: center; }
.logo i { background: #fff; border-radius: 1.5px; opacity: .92; } .logo i:first-child { grid-row: span 2; }
.rev { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rev code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 12px; color: var(--text); }
.totals { display: flex; gap: 18px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.totals b { color: var(--text); font-size: 15px; margin-right: 3px; }
.totals .t { display: flex; align-items: baseline; gap: 5px; }
.totals .t svg { align-self: center; }

/* toolbar */
.toolbar { display: flex; align-items: center; gap: 10px 14px; padding: 10px 20px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; height: 32px; width: 260px; }
.search:focus-within { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { border: 0; outline: 0; background: none; color: var(--text); font: inherit; flex: 1; min-width: 0; }
.search kbd { font: 11px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; height: 32px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 0 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg button:hover { color: var(--text); background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.seg.sm { height: 26px; } .seg.sm button { padding: 0 7px; font-size: 12px; }
.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.spacer { flex: 1; }

/* sub bar */
.subbar { display: flex; align-items: center; gap: 16px; padding: 0 20px 8px; min-height: 30px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.crumbs button { border: 0; background: none; color: var(--accent-text); cursor: pointer; padding: 2px 4px; border-radius: 4px; }
.crumbs span { color: var(--faint); }
.crumbs strong { padding: 2px 4px; }
.hint { color: var(--faint); font-size: 12px; }
.legend { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend .li { display: inline-flex; align-items: center; gap: 5px; }
.sw { width: 14px; height: 14px; border-radius: 3px; display: inline-grid; place-items: center; box-shadow: inset 0 0 0 1px var(--border-strong); }
.heat { display: inline-flex; align-items: stretch; border-radius: 4px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.heat span { width: 44px; height: 18px; font-size: 10.5px; display: grid; place-items: center; color: var(--tile-fg); }
.heat span.inv { color: #fff; }

/* stage */
.stage { flex: 1; display: flex; min-height: 0; padding: 0 12px 12px; gap: 12px; }
.canvas { position: relative; flex: 1; min-width: 0; min-height: 420px; }
.host { position: absolute; border-radius: 12px; background: var(--host-bg); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; transition: left .35s, top .35s, width .35s, height .35s, opacity .2s; }
.still .host, .still .tile { transition: none !important; }
.host.off { border: 1.5px dashed var(--down); background-image: repeating-linear-gradient(135deg, transparent 0 9px, var(--stripe) 9px 11px); }
.host.faded { opacity: .55; }
.hh { position: absolute; left: 0; right: 0; top: 0; background: var(--host-hd); border-bottom: 1px solid var(--border); padding: 6px 10px 0; overflow: hidden; }
.host.off .hh { background: var(--off-hd); }
.hh .hit { position: absolute; inset: 0; border: 0; background: none; cursor: zoom-in; width: 100%; }
.host.zoomed .hh .hit { cursor: default; }
.hh .row { position: relative; pointer-events: none; display: flex; align-items: center; gap: 8px; white-space: nowrap; min-width: 0; }
.hh .row a, .hh .row button { pointer-events: auto; }
.hh .r1 { height: 22px; }
.hh .r2 { height: 20px; font-size: 11.5px; color: var(--muted); gap: 12px; }
.hh .name { font-weight: 700; font-size: 14.5px; }
.hh .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hh .act { margin-left: auto; display: flex; gap: 4px; }
.ibtn { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); font-size: 11.5px; text-decoration: none; color: var(--accent-text); cursor: pointer; }
.ibtn:hover { border-color: var(--accent-text); }
.offbadge { background: var(--down); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; }
.meter { display: inline-flex; align-items: center; gap: 5px; }
.meter i { width: 38px; height: 5px; border-radius: 3px; background: var(--border); position: relative; overflow: hidden; display: inline-block; }
.meter i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; }
.meter i.na { background: repeating-linear-gradient(90deg, var(--border) 0 3px, transparent 3px 5px); }
.over { color: var(--down); font-weight: 600; }
.hb { position: absolute; left: 0; right: 0; bottom: 0; }

/* tiles */
.tile { position: absolute; border-radius: 7px; background: var(--t-bg, var(--unknown-bg)); color: var(--tile-fg); box-shadow: inset 0 0 0 1px var(--t-bd, var(--border)); transition: left .35s, top .35s, width .35s, height .35s, opacity .2s, filter .2s; overflow: hidden; }
.tile .hit { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: none; cursor: pointer; border-radius: inherit; padding: 0; }
.tile .hit:hover { background: rgb(127 127 127 / 8%); }
.tile .hit:focus-visible { outline: 2px solid var(--accent-text); outline-offset: -3px; }
.tc { position: relative; pointer-events: none; padding: 6px 8px; height: 100%; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tc a, .tc button { pointer-events: auto; }
.tn { display: flex; align-items: center; gap: 5px; font-weight: 650; font-size: 13px; min-width: 0; }
.tn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: inherit; }
.tm { font-size: 11.5px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.l1 .tc { padding: 3px 6px; justify-content: center; }
.tile.l1 .tn { font-size: 11.5px; }
.tile.big .tn { font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; overflow: hidden; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px 0 5px; border-radius: 10px; font-size: 11.5px; background: var(--surface); color: var(--text); text-decoration: none; border: 1px solid var(--border); white-space: nowrap; max-width: 100%; }
a.chip:hover { border-color: var(--accent-text); color: var(--accent-text); }
.chip.more { color: var(--muted); padding: 0 7px; }
.chip.dim { opacity: .35; }
.chip.hit2 { border-color: var(--accent-text); box-shadow: 0 0 0 1px var(--accent-text); }
.tile.dim { opacity: .16; filter: grayscale(1); }
.tile.sel { box-shadow: inset 0 0 0 2px var(--accent-text), 0 0 0 3px var(--accent-soft); z-index: 2; }
.c-live-up { --t-bg: var(--up-bg); --t-bd: var(--up-bd); }
.c-live-warn { --t-bg: var(--warn-bg); --t-bd: var(--warn-bd); }
.c-live-down { --t-bg: var(--down-bg); --t-bd: var(--down-bd); background-image: repeating-linear-gradient(135deg, transparent 0 7px, var(--stripe) 7px 10px); }
.c-live-unknown { --t-bg: var(--unknown-bg); --t-bd: var(--unknown-bd); }
.c-run-in-sync { --t-bg: var(--run-sync); --t-bd: var(--run-sync-bd); }
.c-run-pending { --t-bg: var(--run-pending); --t-bd: var(--run-pending-bd); }
.c-run-failed { --t-bg: var(--run-failed); --t-bd: var(--run-failed-bd); }
.c-run-awaiting-approval { --t-bg: var(--run-await); --t-bd: var(--run-await-bd); }
.c-run-uncertain { --t-bg: var(--run-unc); --t-bd: var(--run-unc-bd); background-image: repeating-linear-gradient(45deg, transparent 0 7px, rgb(127 127 127 / 10%) 7px 9px); }
.c-heat-0 { --t-bg: var(--h0); } .c-heat-1 { --t-bg: var(--h1); } .c-heat-2 { --t-bg: var(--h2); }
.c-heat-3 { --t-bg: var(--h3); } .c-heat-4 { --t-bg: var(--h4); --tile-fg: #fff; } .c-heat-5 { --t-bg: var(--h5); --tile-fg: #fff; }
[class*="c-heat-"] { --t-bd: rgb(0 0 0 / 10%); }
.tile.free { background: var(--free-bg) radial-gradient(var(--free-dot) 1px, transparent 1.4px) 0 0 / 10px 10px; box-shadow: inset 0 0 0 1px var(--border); color: var(--muted); }
.tile.free .tc { justify-content: center; align-items: center; text-align: center; }
.tile.free .hit { cursor: zoom-in; }
.zoomed .tile.free .hit { cursor: default; }
.tile.free .hit:hover { background: none; }
.tile.ub { background: repeating-linear-gradient(135deg, var(--um-a) 0 6px, var(--um-b) 6px 12px); box-shadow: inset 0 0 0 1px var(--border-strong); color: var(--muted); }
.tile.ub.open { background: transparent; box-shadow: inset 0 0 0 1.5px var(--border-strong); border: 0; outline: 1.5px dashed var(--border-strong); outline-offset: -1.5px; }
.tile.ub .tn { color: var(--text); }
.tile.ub.open .tc { padding: 3px 8px; }
.tile.ut { background: repeating-linear-gradient(135deg, var(--um-b) 0 5px, var(--surface) 5px 10px); box-shadow: inset 0 0 0 1px var(--border); color: var(--muted); }
.tile.ut .tn { color: var(--text); font-weight: 600; }
.badge { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--muted); font-weight: 600; }
.glyph { flex: none; }

.empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.empty div { pointer-events: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px; text-align: center; box-shadow: var(--shadow); }
.empty p { margin: 4px 0 12px; color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 5px 12px; cursor: pointer; }

/* side panel */
.panel { width: 380px; flex: none; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: auto; }
.panel[hidden] { display: none; }
.ph { position: sticky; top: 0; background: var(--surface); padding: 14px 16px 12px; border-bottom: 1px solid var(--border); z-index: 1; }
.kick { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.ph h2 { margin: 3px 0 8px; font-size: 19px; display: flex; align-items: center; gap: 8px; word-break: break-all; }
.close { position: absolute; right: 10px; top: 10px; width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 16px; line-height: 1; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
.psec { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.psec h3 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); display: flex; justify-content: space-between; }
.ups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
.ups div { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.ups div.on { border-color: var(--accent-text); background: var(--accent-soft); }
.ups small { display: block; font-size: 11px; color: var(--muted); }
.ups b { font-size: 15px; }
.strip { display: block; width: 100%; height: 26px; }
.axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); margin: 2px 0 8px; }
dl.facts { display: grid; grid-template-columns: 110px 1fr; gap: 5px 10px; margin: 0; font-size: 13px; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.svc { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; margin-bottom: 8px; }
.svc.hitsvc { border-color: var(--accent-text); }
.svc header { display: flex; align-items: center; gap: 6px; }
.svc header b { flex: 1; }
.svc .desc { color: var(--muted); font-size: 12px; margin: 2px 0 4px; }
.svc ul { list-style: none; margin: 4px 0 0; padding: 0; }
.svc li { display: flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 0; }
.svc li a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.svc .note { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 4px 7px; margin-top: 5px; }
.svc details { margin-top: 5px; font-size: 12px; }
.svc summary { cursor: pointer; color: var(--muted); }
.svc table { width: 100%; border-collapse: collapse; margin-top: 4px; }
.svc td { padding: 2px 4px 2px 0; vertical-align: top; overflow-wrap: anywhere; }
.svc td:first-child { color: var(--muted); width: 48px; font-family: ui-monospace, monospace; font-size: 11px; }
.um-list { list-style: none; padding: 0; margin: 0; font-size: 12.5px; }
.um-list li { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--border); }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 7px 9px; border-radius: 8px; max-width: 280px; box-shadow: var(--shadow); opacity: 0; transition: opacity .1s; }
.tip.on { opacity: 1; }
.tip b { display: block; font-size: 13px; }
@media (max-width: 1100px) { .panel { width: 340px; } .search { width: 220px; } .totals { gap: 12px; } }
@media (max-width: 720px) { body { overflow: auto; } .stage { flex-direction: column; } .panel { width: auto; } .canvas { min-height: 560px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span>Inventory</h1>
    <span class="rev" id="rev"></span>
  </div>
  <div class="totals" id="totals"></div>
</header>
<div class="toolbar" role="toolbar" aria-label="Filters and view">
  <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search guests, services, URLs…" aria-label="Search"><kbd>/</kbd></label>
  <div class="seg" id="fLive" role="group" aria-label="Liveness filter"></div>
  <div class="seg" id="fKind" role="group" aria-label="Kind filter"></div>
  <span class="spacer"></span>
  <span class="ctl">Size <span class="seg" id="sizeBy" role="group" aria-label="Size by"></span></span>
  <span class="ctl">Color <span class="seg" id="colorBy" role="group" aria-label="Color by"></span></span>
</div>
<div class="subbar">
  <nav class="crumbs" id="crumbs" aria-label="Zoom"></nav>
  <span class="ctl">Uptime <span class="seg sm" id="win" role="group" aria-label="Uptime window"></span></span>
  <div class="legend" id="legend" aria-label="Legend"></div>
</div>
<main class="stage">
  <div class="canvas" id="canvas" aria-label="Resource treemap"></div>
  <aside class="panel" id="panel" hidden aria-label="Details"></aside>
</main>
<div class="tip" id="tip" role="tooltip"></div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
(() => {
const I = window.INV, F = I.fmt;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LIVE = ["down", "warn", "up", "unknown"];
const WIN = { h24: "24h", d7: "7d", d30: "30d" };
const S = { q: "", live: new Set(), kind: new Set(), size: "memory", color: "live", win: "d30", zoom: null, sel: null, open: new Set() };

/* ---------- glyphs: shape differs per status, not only colour ---------- */
function glyph(st, size = 13) {
  const c = `var(--${st === "unknown" ? "unknown" : st})`;
  const body = {

const RUNG = { "in-sync": "=", pending: "…", failed: "✕", "awaiting-approval": "!", uncertain: "?", succeeded: "✓" };

/* ---------- sizing ---------- */
const SIZE = {
  memory: { label: "Memory", host: (n) => n.memory.total, guest: (g) => g.memory, un: (u) => u.memory, fmt: (v) => F.bytes(v) },
  cores: { label: "Cores", host: (n) => n.cpu.cores, guest: (g) => g.cores, un: (u) => u.cores, fmt: (v) => `${+v.toFixed(1)} cores` },
  disk: { label: "Disk", host: (n) => n.disk.total, guest: (g) => g.disk, un: () => 0, fmt: (v) => F.bytes(v) },

function hostModel(n) {
  const z = SIZE[S.size];
  const guests = I.guestsOf(n.id);
  const gSum = guests.reduce((a, g) => a + z.guest(g), 0);
  const uSum = n.unmanaged.reduce((a, u) => a + z.un(u), 0);
  const total = z.host(n), alloc = gSum + uSum;
  return { n, guests, gSum, uSum, total, alloc, free: Math.max(0, total - alloc), area: Math.max(total, alloc) };

/* ---------- squarify (Bruls et al.), keeps the given order ---------- */
function squarify(values, rect) {
  const total = values.reduce((a, b) => a + b, 0);
  const out = new Array(values.length);
  if (!total || rect.w <= 0 || rect.h <= 0) return values.map(() => ({ x: rect.x, y: rect.y, w: 0, h: 0 }));
  const scale = (rect.w * rect.h) / total;
  const areas = values.map((v) => v * scale);
  let r = { ...rect }, row = [], i = 0;
  const worst = (idx, side) => {
    const s = idx.reduce((a, k) => a + areas[k], 0);
    let mx = 0, mn = Infinity;
    for (const k of idx) { mx = Math.max(mx, areas[k]); mn = Math.min(mn, areas[k]); }
    return Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
  };
  const place = (idx) => {
    const s = idx.reduce((a, k) => a + areas[k], 0);
    if (r.w >= r.h) {
      const cw = r.h ? s / r.h : 0; let y = r.y;
      for (const k of idx) { const h = cw ? areas[k] / cw : 0; out[k] = { x: r.x, y, w: cw, h }; y += h; }
      r.x += cw; r.w -= cw;
    } else {
      const rh = r.w ? s / r.w : 0; let x = r.x;
      for (const k of idx) { const w = rh ? areas[k] / rh : 0; out[k] = { x, y: r.y, w, h: rh }; x += w; }
      r.y += rh; r.h -= rh;
    }
  };
  while (i < areas.length) {
    if (areas[i] <= 0) { out[i] = { x: r.x, y: r.y, w: 0, h: 0 }; i++; continue; }
    const side = Math.min(r.w, r.h);
    if (!row.length || worst([...row, i], side) <= worst(row, side)) { row.push(i); i++; }
    else { place(row); row = []; }
  }
  if (row.length) place(row);
  return out;
}

/* ---------- filters ---------- */
const active = () => !!(S.q || S.live.size || S.kind.size);
const has = (kind, x) => I.haystack(kind, x).includes(S.q);

  const qG = !S.q || has("guest", g) || has("node", I.nodeById[g.node]);
  const liveG = !S.live.size || S.live.has(g.status);

/* ---------- colours ---------- */

/* ---------- tile content ---------- */

/* ---------- layout + render ---------- */
const canvas = $("#canvas");
const HH = 50;
function hostHeader(hm, zoomed) {

function hostBoxes(hm, W, H) {
  const n = hm.n, z = SIZE[S.size], boxes = [];
  const inner = { x: 3, y: 3, w: W - 6, h: H - 6 };
  const items = [];

  if (n.unmanaged.length && hm.uSum > 0) items.push({ t: "ub", v: hm.uSum });

    const r = ins(rects[k]);

      boxes.push(guestBox(it.g, r, m));
    } else if (it.t === "free") {
      const key = "f:" + n.id;
      const lv = level(r.w, r.h);
      boxes.push({ key, r, cls: `tile free${active() ? " dim" : ""}`, label: `Unallocated ${z.fmt(it.v)} on ${n.name}`,
        html: r.w >= 84 && r.h >= 20 ? `<div class="tm">Unallocated</div>${r.h >= 40 ? `<div class="tm mono">${z.fmt(it.v)}</div>` : ""}` : "" });
      tips.set(key, `<b>Unallocated</b>${z.fmt(it.v)} of ${z.fmt(hm.total)} ${z.label.toLowerCase()} on ${esc(n.name)}`);

        html: lv ? `<div class="tn"><b>Unmanaged (${n.unmanaged.length})</b><span aria-hidden="true">${open ? "▾" : "▸"}</span></div>${!open && lv > 1 ? `<div class="tm">${active() && hits ? `${hits} match · ` : ""}${z.fmt(it.v)}${tpl ? ` · ${tpl} template` : ""} · no checks</div>` : ""}` : "" });

      acts.set(key, () => { S.open.has(n.id) ? S.open.delete(n.id) : S.open.add(n.id); render(); });
      if (open) {

            html: ul === 0 ? "" : ul === 1 ? `<div class="tn"><b>${esc(u.name)}</b></div>` : `<div class="tn">${glyph("unknown", 12)}<b>${esc(u.name)}</b>${u.template ? `<span class="badge">template</span>` : ""}</div><div class="tm">${kind} ${u.vmid} · ${esc(u.status)} · ${z.fmt(z.un(u))}</div>` });
          tips.set(ukey, `<b>${esc(u.name)}</b>Unmanaged ${kind} ${u.vmid}${u.template ? " (template)" : ""} · ${esc(u.status)}<br>${z.fmt(z.un(u))} · no checks`);

function setBox(el, r) {

}

const mkTile = () => { const d = document.createElement("div"); d.innerHTML = `<button class="hit" type="button"></button><div class="tc"></div>`; return d; };

function render() {

/* ---------- chrome: crumbs, legend, controls ---------- */

  else if (S.color === "run") lg = ["in-sync", "pending", "awaiting-approval", "failed", "uncertain"].map((r) => `<span class="li"><span class="sw c-run-${r}" style="background:var(--t-bg)"></span>${runText(r)}</span>`).join("");
  else lg = `<span class="li">Uptime ${WIN[S.win]}</span><span class="heat">${HEAT.map(([t, l], i) => `<span class="c-heat-${i}${i > 3 ? " inv" : ""}" style="background:var(--t-bg)">${i === 0 ? "100" : i === 5 ? "&lt;97" : "≥" + l}</span>`).join("")}</span>`;
  lg += `<span class="li"><span class="sw" style="background:repeating-linear-gradient(135deg,var(--um-a) 0 3px,var(--um-b) 3px 6px)"></span>Unmanaged</span><span class="li"><span class="sw" style="background:var(--free-bg) radial-gradient(var(--free-dot) 1px,transparent 1.4px) 0 0/5px 5px"></span>Unallocated</span>`;
  $("#legend").innerHTML = lg;
}
function sync2() { writeHash(); render(); }

/* ---------- side panel ---------- */
const panel = $("#panel");
function strip(beats) {
  const col = { up: "var(--up)", warn: "var(--warn)", down: "var(--down)" };
  const n = { down: beats.filter((b) => b === "down").length, warn: beats.filter((b) => b === "warn").length };
  return `<svg class="strip" viewBox="0 0 384 26" preserveAspectRatio="none" role="img" aria-label="Last 24 hours: ${n.down} down and ${n.warn} degraded of 96 checks">${beats.map((b, i) => `<rect x="${i * 4}" y="${b === "up" ? 4 : 0}" width="3" height="${b === "up" ? 22 : 26}" rx="1" fill="${col[b]}"/>`).join("")}</svg>
  <div class="axis"><span>24h ago</span><span>now</span></div>`;
}
function daily(d) {
  return `<svg class="strip" viewBox="0 0 300 30" preserveAspectRatio="none" role="img" aria-label="Daily uptime, last 30 days, lowest ${Math.min(...d)}%">${d.map((p, i) => { const h = 4 + Math.max(0, Math.min(1, (p - 90) / 10)) * 26; return `<rect x="${i * 10}" y="${30 - h}" width="8" height="${h}" rx="1" fill="${p >= 99.9 ? "var(--up)" : p >= 99 ? "var(--warn)" : "var(--down)"}"><title>${p}%</title></rect>`; }).join("")}</svg>
  <div class="axis"><span>30 days ago</span><span>today</span></div>`;
}
function uptimeSec(c) {
  return `<div class="psec"><h3><span>Uptime</span><span>${I.liveness[c.status].label} since ${F.time(c.since)}</span></h3>
  <div class="ups">${Object.entries(WIN).map(([k, l]) => `<div class="${k === S.win ? "on" : ""}"><small>${l}</small><b class="mono">${F.pct(c.uptime[k])}</b></div>`).join("")}</div>
  ${strip(c.beats)}${daily(c.daily)}</div>`;
}
const pill = (st) => `<span class="pill">${glyph(st, 12)}${I.liveness[st].label}</span>`;
const facts = (rows) => `<dl class="facts">${rows.filter(Boolean).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>`;
function svcCard(s, hits) {
  return `<div class="svc${active() && hits.has(s.id) ? " hitsvc" : ""}"><header>${glyph(s.status)}<b>${esc(s.name)}</b><span class="mono" style="font-size:12px">${s.check ? F.pct(s.check.uptime[S.win]) : "No check"}</span></header>
    <div class="desc">${esc(s.description)} · ${esc(s.category)}${s.runStatus !== "in-sync" ? ` · run: ${I.runLabels[s.runStatus].label}` : ""}</div>
    ${s.check ? strip(s.check.beats).replace('class="axis"', 'class="axis" hidden') : ""}
    ${s.urls.length ? `<ul>${s.urls.map((u) => `<li>${glyph(u.check.status, 11)}<a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.host)}${new URL(u.url).pathname !== "/" ? esc(new URL(u.url).pathname) : ""}</a><span class="mono" style="font-size:11px;color:var(--muted)">${F.ms(u.check.ms)}</span></li>`).join("")}</ul>` : ""}
    ${s.health ? `<div class="note">Health: <span class="mono">${esc(s.health.url)}</span>${s.health.probed ? "" : " (not probed)"}</div>` : ""}
    ${s.notes.map((t) => `<div class="note">${esc(t)}</div>`).join("")}
    ${s.dns.length ? `<details><summary>DNS records (${s.dns.length})</summary><table>${s.dns.map((d) => `<tr><td>${d.type}</td><td>${esc(d.name)} → <span class="mono">${esc(d.expected)}</span></td></tr>`).join("")}</table></details>` : ""}</div>`;
}
function renderPanel() {
  const sel = S.sel;
  if (!sel) { panel.hidden = true; return; }
  let h = "";
  const close = `<button class="close" type="button" data-act="close" aria-label="Close details">×</button>`;
  if (sel.type === "guest") {
    const g = I.guestById[sel.id], n = I.nodeById[g.node], svcs = I.servicesOf(g.id), m = guestMatch(g);
    const kind = g.kind === "lxc" ? "Container" : "VM";
    h = `<div class="ph">${close}<div class="kick">${kind} · on ${esc(n.name)}</div><h2>${glyph(g.status, 17)}${esc(g.id)}</h2>
      <div class="pills">${pill(g.status)}<span class="pill">Run: ${runText(g.runStatus)}</span><span class="pill">Power: ${esc(g.power)}</span>
      <a class="ibtn" href="${esc(I.proxmoxGuestUrl(g))}" target="_blank" rel="noopener">Proxmox ${ext}</a></div></div>
      ${uptimeSec(g.check)}
      <div class="psec"><h3>Guest</h3>${facts([["VMID", `<span class="mono">${g.vmid}</span> (${kind})`], ["Host", esc(n.name)], ["Address", g.address ? `<span class="mono">${esc(g.address)}</span>` : "—"],
        ["Hostname", `<span class="mono">${esc(g.hostname)}</span>`], ["Resources", `${g.cores} cores · ${F.bytes(g.memory)} · ${F.bytes(g.disk)} disk`], ["Uptime", F.duration(g.uptimeSeconds)],
        ["Workflow", `<span class="mono">${esc(g.workflow)}</span>`], ["Last run", `${I.runLabels[g.lastRun.status].label} · ${F.ago(g.lastRun.at)}`], ["About", esc(g.description)]])}</div>
      <div class="psec"><h3><span>Services (${svcs.length})</span></h3>${svcs.length ? svcs.map((s) => svcCard(s, m.svcs)).join("") : `<div class="note" style="color:var(--muted)">No services declared on this guest.</div>`}</div>`;
  } else if (sel.type === "host") {
    const n = I.nodeById[sel.id], hm = hostModel(n);
    h = `<div class="ph">${close}<div class="kick">Proxmox host</div><h2>${glyph(n.status, 17)}${esc(n.name)}</h2>
      <div class="pills">${pill(n.status)}${n.online ? `<span class="pill">Online</span>` : `<span class="pill" style="color:var(--down)">Offline · ${esc(n.offlineReason)}</span>`}
      <a class="ibtn" href="${esc(n.proxmoxUrl)}" target="_blank" rel="noopener">Proxmox ${ext}</a></div></div>
      ${uptimeSec(n.check)}
      <div class="psec"><h3>Host${n.online ? "" : " · last-known values"}</h3>${facts([["Address", `<span class="mono">${esc(n.address)}</span>`], ["PVE", esc(n.version)], ["CPU", `${n.cpu.cores} cores · ${n.cpu.used == null ? "—" : Math.round(n.cpu.used * 100) + "%"} used<br><small style="color:var(--muted)">${esc(n.cpu.model)}</small>`],
        ["Memory", `${F.bytes(n.memory.used)} / ${F.bytes(n.memory.total)}`], ["Disk", `${F.bytes(n.disk.used)} / ${F.bytes(n.disk.total)}`], ["Host uptime", F.duration(n.uptimeSeconds)],
        ["Guests", `${hm.guests.length} managed · ${n.unmanaged.length} unmanaged`]])}</div>
      <div class="psec"><h3>Unmanaged (${n.unmanaged.length})</h3><ul class="um-list">${n.unmanaged.map((u) => `<li>${glyph("unknown", 12)}<b>${esc(u.name)}</b><span class="mono" style="color:var(--muted)">${u.vmid}</span>${u.template ? `<span class="badge">template</span>` : ""}<span style="margin-left:auto;color:var(--muted)">${esc(u.status)}</span></li>`).join("")}</ul></div>`;
  } else {
    const n = I.nodeById[sel.host], u = n.unmanaged.find((x) => x.vmid === sel.vmid);
    const kind = u.kind === "lxc" ? "Container" : "VM";
    h = `<div class="ph">${close}<div class="kick">Unmanaged ${kind} · on ${esc(n.name)}</div><h2>${glyph("unknown", 17)}${esc(u.name)}</h2>
      <div class="pills">${pill("unknown")}${u.template ? `<span class="badge">template</span>` : ""}<a class="ibtn" href="${esc(I.proxmoxGuestUrl({ node: n.id, kind: u.kind, vmid: u.vmid }))}" target="_blank" rel="noopener">Proxmox ${ext}</a></div></div>
      <div class="psec"><div class="note" style="color:var(--muted)">Octopushy doesn't manage this guest, so it has no definition, run status or checks.</div></div>
      <div class="psec">${facts([["VMID", `<span class="mono">${u.vmid}</span> (${kind})`], ["Status", esc(u.status)], ["Resources", `${u.cores} cores · ${F.bytes(u.memory)}`], ["Uptime", u.uptimeSeconds ? F.duration(u.uptimeSeconds) : "—"], ["Tags", u.tags.length ? u.tags.map(esc).join(", ") : "—"]])}</div>`;
  }
  panel.innerHTML = h;
  panel.hidden = false;
}
function select(sel) {
  S.sel = sel && S.sel?.id === sel.id ? null : sel;
  renderPanel(); writeHash(); render();
}
function zoom(id) { if (S.zoom === id) return; S.zoom = id; writeHash(); render(); }

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "host") select({ type: "host", id: a.dataset.id });
    else if (act === "close") select(null);
    else if (act === "unzoom") { S.zoom = null; sync2(); }
    else if (act === "clear") { S.q = ""; $("#q").value = ""; S.live.clear(); S.kind.clear(); sync2(); }
    return;
  }
  const hit = e.target.closest(".hit");
  if (hit && canvas.contains(hit)) acts.get(hit.closest("[data-key]").dataset.key)?.();
});
$("#q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); sync2(); if (S.sel) renderPanel(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape") {
    if (document.activeElement === $("#q") && S.q) return;
    if (S.sel) select(null); else if (S.zoom) { S.zoom = null; sync2(); }
  }
});
const tip = $("#tip");
canvas.addEventListener("pointermove", (e) => {
  const k = e.target.closest(".tile")?.dataset.key;
  const t = k && !e.target.closest("a") && tips.get(k);
  if (!t) { tip.classList.remove("on"); return; }
  if (tip._k !== k) { tip.innerHTML = t; tip._k = k; }
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 18 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 18;
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.classList.add("on");
});
canvas.addEventListener("pointerleave", () => tip.classList.remove("on"));
let lastW = 0, lastH = 0;
new ResizeObserver(() => {
  if (canvas.clientWidth === lastW && canvas.clientHeight === lastH) return;
  lastW = canvas.clientWidth; lastH = canvas.clientHeight;
  // resizes snap; only user actions animate
  canvas.classList.add("still"); render(); requestAnimationFrame(() => requestAnimationFrame(() => canvas.classList.remove("still")));
}).observe(canvas);

/* ---------- hash state ---------- */
function writeHash() {
  const p = new URLSearchParams();
  if (S.q) p.set("q", S.q);
  if (S.zoom) p.set("zoom", S.zoom);
  if (S.size !== "memory") p.set("size", S.size);
  if (S.color !== "live") p.set("color", S.color);
  if (S.sel?.type === "guest") p.set("select", S.sel.id);
  if (S.sel?.type === "host") p.set("host", S.sel.id);
  if (S.open.size) p.set("open", [...S.open].join(","));
  if (S.live.size) p.set("live", [...S.live].join(","));
  const h = p.toString().replace(/%2C/g, ",");
  history.replaceState(null, "", h ? "#" + h : location.pathname);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S.q = (p.get("q") || "").toLowerCase(); $("#q").value = S.q;
  if (I.nodeById[p.get("zoom")]) S.zoom = p.get("zoom");
  if (SIZE[p.get("size")]) S.size = p.get("size");
  if (["live", "uptime", "run"].includes(p.get("color"))) S.color = p.get("color");
  if (I.guestById[p.get("select")]) S.sel = { type: "guest", id: p.get("select") };
  if (I.nodeById[p.get("host")]) S.sel = { type: "host", id: p.get("host") };
  for (const id of (p.get("open") || "").split(",")) if (I.nodeById[id]) S.open.add(id);
  for (const l of (p.get("live") || "").split(",")) if (LIVE.includes(l)) S.live.add(l);
}

/* ---------- header ---------- */
const T = I.totals();
$("#rev").innerHTML = `rev <code>${esc(I.revision.commit)}</code> ${esc(I.revision.subject)} · observed ${F.ago(I.observedAt)}`;
$("#totals").innerHTML = [
  [`${T.nodes.up}/${T.nodes.total}`, "hosts up", T.nodes.down ? "down" : "up"],
  [`${T.guests.up}/${T.guests.total}`, "guests up", T.guests.down ? "down" : "up"],
  [T.services.total, `services · ${T.services.up} up · ${T.services.warn} degraded · ${T.services.down} down · ${T.services.unknown} no check`, T.services.down ? "down" : T.services.warn ? "warn" : "up"],
  [T.unmanaged, "unmanaged", null],
].map(([n, l, st]) => `<span class="t">${st ? glyph(st, 12) : ""}<b>${n}</b>${l}</span>`).join("");

readHash();
renderPanel();
render();
})();
</script>
</body>
</html>
