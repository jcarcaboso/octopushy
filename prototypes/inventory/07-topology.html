<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory · Topology</title>
<!--
  Concept: the inventory as a dependency graph, left to right: Proxmox hosts → guests → services
  → DNS names. Read it right to left to follow a request: a name → its CNAME → the A record →
  the guest → the host. Hover any box to light its whole path; click for details.
  Hash state for testing: #q=fleet  #select=d:outline.testing.example.org  #dns=0
  #open=moraband  #live=down  #hosts=moraband
-->
<style>
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #f6f8fa; --text: #17202b; --muted: #5b6675; --faint: #8a94a3;
  --border: #d9dee6; --border-strong: #b6bfcb; --accent: #2f5bd3; --accent-text: #2f5bd3; --accent-soft: #e4ebfb;
  --up: #1f9d55; --warn: #c98a0b; --down: #d63b3b; --unknown: #8a94a3;
  --up-soft: #e7f5ec; --warn-soft: #fcf3dc; --down-soft: #fbe7e5;
  --band: #ffffff; --band-bd: #e3e7ed; --off-band: #fdf1ef; --hatch: rgb(214 59 59 / 10%);
  --node: #ffffff; --node-bd: #cfd6df; --edge-up: #7cc39a; --grid: #e9edf2;
  --shadow: 0 1px 2px rgb(16 24 40 / 6%), 0 8px 24px rgb(16 24 40 / 10%);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f14; --surface: #141920; --surface-2: #1a2028; --text: #e6ebf2; --muted: #9aa5b4; --faint: #6f7a89;
    --border: #262e39; --border-strong: #3a4452; --accent: #2f5bd3; --accent-text: #8aa6ff; --accent-soft: #1b2847;
    --up: #3ccf7c; --warn: #f0b429; --down: #ff6b61; --unknown: #8a94a3;
    --up-soft: #12301f; --warn-soft: #33290e; --down-soft: #3a1717;
    --band: #10151b; --band-bd: #1f2731; --off-band: #1d1214; --hatch: rgb(255 107 97 / 9%);
    --node: #171d25; --node-bd: #303a47; --edge-up: #2f8a57; --grid: #161c23;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 10px 30px rgb(0 0 0 / 45%);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
a { color: var(--accent-text); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

.top { display: flex; align-items: center; gap: 24px; padding: 12px 20px 10px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex: 1 1 auto; }
.brand h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 9px; }
.logo { width: 22px; height: 22px; align-self: center; }
.rev { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rev code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; font-size: 12px; color: var(--text); }
.totals { display: flex; gap: 18px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.totals b { color: var(--text); font-size: 15px; margin-right: 3px; }
.totals .t { display: flex; align-items: baseline; gap: 5px; }
.totals .t svg { align-self: center; }

.toolbar { display: flex; align-items: center; gap: 10px 14px; padding: 10px 20px 8px; flex-wrap: wrap; }
.search { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 0 8px; height: 32px; width: 250px; }
.search:focus-within { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { border: 0; outline: 0; background: none; color: var(--text); font: inherit; flex: 1; min-width: 0; }
.search kbd { font: 11px ui-monospace, monospace; color: var(--faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; height: 32px; }
.seg button { border: 0; background: none; border-radius: 6px; padding: 0 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.seg button:hover { color: var(--text); background: var(--surface-2); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.switch { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px 0 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 12.5px; color: var(--muted); }
.switch i { width: 26px; height: 15px; border-radius: 8px; background: var(--border-strong); position: relative; transition: background .15s; }
.switch i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 11px; height: 11px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-pressed="true"] { color: var(--text); }
.switch[aria-pressed="true"] i { background: var(--accent); }
.switch[aria-pressed="true"] i::after { left: 13px; }
.spacer { flex: 1; }

.legend { display: flex; align-items: center; gap: 6px 16px; padding: 0 20px 10px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend .li { display: inline-flex; align-items: center; gap: 6px; }
.legend .lnote { color: var(--faint); margin-right: 6px; }

.scroller { flex: 1; min-height: 0; overflow: auto; margin: 0 12px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; position: relative; overscroll-behavior: contain; }
.scroller.grab { cursor: grabbing; }
.content { position: relative; }
.colhd { position: sticky; top: 0; z-index: 3; height: 36px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
.colhd span { position: absolute; top: 9px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; white-space: nowrap; }
.colhd span b { color: var(--muted); font-weight: 600; }
svg.graph { display: block; }
.band { fill: var(--band); stroke: var(--band-bd); }
.band.off { fill: url(#hatch); stroke: var(--down); stroke-dasharray: 6 4; stroke-width: 1.3; }
.bandlbl { font: 600 10.5px system-ui, sans-serif; letter-spacing: .08em; fill: var(--faint); text-transform: uppercase; }
.bandlbl.off { fill: var(--down); }
.edge { fill: none; stroke-width: 1.6; transition: opacity .15s, stroke-width .15s; }
.edge.st-up { stroke: var(--edge-up); }
.edge.st-warn { stroke: var(--warn); }
.edge.st-down { stroke: var(--down); stroke-dasharray: 6 4; }
.edge.st-unknown { stroke: var(--unknown); stroke-dasharray: 1.5 4; stroke-linecap: round; opacity: .85; }
.edge.cname { stroke-width: 1.3; }
.node { cursor: pointer; transition: opacity .15s; }
.node .box { fill: var(--node); stroke: var(--node-bd); stroke-width: 1; }
.node:hover .box, .node.sel .box { stroke: var(--accent-text); stroke-width: 1.8; }
.node:focus { outline: none; }
.node:focus-visible .box { stroke: var(--accent-text); stroke-width: 2.6; }
.node.st-down .box { fill: var(--down-soft); stroke: var(--down); }
.node.st-warn .box { fill: var(--warn-soft); stroke: var(--warn); }
.node.t-unm .box, .node.t-ug .box { stroke-dasharray: 4 3; fill: var(--surface-2); }
.node.t-host .box { stroke-width: 1.3; }
.node.t-host.off .box { fill: var(--down-soft); stroke: var(--down); stroke-dasharray: 6 4; stroke-width: 1.6; }
.lbl { font: 600 12.5px system-ui, sans-serif; fill: var(--text); }
.lbl.big { font-size: 14.5px; font-weight: 700; }
.lbl.dns { font: 500 12px system-ui, sans-serif; }
.zone { fill: var(--muted); font-weight: 400; }
.sub { font: 400 11px system-ui, sans-serif; fill: var(--muted); }
.sub.bad { fill: var(--down); font-weight: 600; }
.sub.att { fill: var(--accent-text); font-weight: 600; }
.pct { font: 500 11px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: var(--muted); }
.pct.st-down { fill: var(--down); } .pct.st-warn { fill: var(--warn); }
.rtype { font: 700 9px ui-monospace, monospace; fill: var(--muted); }
.rtbox { fill: var(--surface-2); stroke: var(--border-strong); }
.bar-bg { fill: var(--grid); }
.bar { fill: var(--accent); }
.bar.na { fill: url(#na); }
.go { fill: var(--accent-text); }
.go:hover rect { fill: var(--accent-soft); }
.go rect { fill: transparent; }
.go path { stroke: var(--accent-text); }
.matchring { fill: none; stroke: var(--accent-text); stroke-width: 2; stroke-dasharray: 3 2; opacity: 0; }
svg.filtering .node:not(.match), svg.filtering .edge:not(.match) { opacity: .13; }
svg.filtering .node.hit .matchring { opacity: 1; }
svg.hover .node:not(.lit), svg.hover .edge:not(.lit) { opacity: .1; }
svg.hover .node.lit, svg.hover .edge.lit { opacity: 1; }
svg.hover .edge.lit { stroke-width: 2.6; }

.card { position: absolute; z-index: 4; width: 340px; max-height: min(560px, 72vh); overflow: auto; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 12px; box-shadow: var(--shadow); font-size: 13px; }
.card .ch { padding: 12px 14px 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
.kick { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.card h2 { margin: 2px 0 6px; font-size: 16px; display: flex; align-items: center; gap: 7px; overflow-wrap: anywhere; padding-right: 26px; }
.close { position: absolute; right: 8px; top: 8px; width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; line-height: 1; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); }
.lnk { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); text-decoration: none; }
.lnk:hover { border-color: var(--accent-text); }
.cs { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.cs:last-child { border-bottom: 0; }
.cs h3 { margin: 0 0 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); display: flex; justify-content: space-between; }
.ups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
.ups div { border: 1px solid var(--border); border-radius: 7px; padding: 4px 7px; }
.ups div.on { border-color: var(--accent-text); background: var(--accent-soft); }
.ups small { display: block; font-size: 10.5px; color: var(--muted); }
.ups b { font-size: 13.5px; }
.strip { display: block; width: 100%; height: 22px; }
.axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
dl.facts { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; margin: 0; }
dl.facts dt { color: var(--muted); }
dl.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.meter { height: 5px; border-radius: 3px; background: var(--grid); margin-top: 3px; overflow: hidden; }
.meter b { display: block; height: 100%; background: var(--accent); }
.path { list-style: none; margin: 0; padding: 0; }
.path li { display: flex; gap: 8px; align-items: flex-start; position: relative; padding: 0 0 10px 0; }
.path li:not(:last-child)::before { content: ""; position: absolute; left: 6px; top: 16px; bottom: 0; border-left: 1.5px dashed var(--border-strong); }
.path .dot { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--accent-text); background: var(--surface); flex: none; margin-top: 3px; }
.path small { display: block; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 6px; padding: 4px 7px; margin-top: 5px; }
.urls { list-style: none; margin: 0; padding: 0; }
.urls li { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
.urls a { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.dns { width: 100%; border-collapse: collapse; font-size: 12px; }
table.dns td { padding: 2px 6px 2px 0; vertical-align: top; overflow-wrap: anywhere; }
table.dns td:first-child { font: 600 10.5px ui-monospace, monospace; color: var(--muted); width: 44px; }
.badge { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border-strong); color: var(--muted); font-weight: 600; }
.empty { position: sticky; left: 0; top: 40%; z-index: 3; display: grid; place-items: center; height: 0; overflow: visible; }
.empty div { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 22px; text-align: center; box-shadow: var(--shadow); transform: translateY(40px); }
.empty p { margin: 4px 0 10px; color: var(--muted); }
.btn { border: 1px solid var(--border); background: var(--surface-2); border-radius: 7px; padding: 5px 12px; cursor: pointer; }
@media (max-width: 1100px) { .search { width: 200px; } .totals { gap: 12px; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <h1><svg class="logo" viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="6" fill="#2f5bd3"/><circle cx="6" cy="11" r="2.2" fill="#fff"/><circle cx="16" cy="6" r="2.2" fill="#fff"/><circle cx="16" cy="16" r="2.2" fill="#fff"/><path d="M8 10.2L14 6.8M8 11.8l6 3.4" stroke="#fff" stroke-width="1.4"/></svg>Inventory</h1>
    <span class="rev" id="rev"></span>
  </div>
  <div class="totals" id="totals"></div>
</header>
<div class="toolbar" role="toolbar" aria-label="Filters and view">
  <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="Search everything…" aria-label="Search"><kbd>/</kbd></label>
  <div class="seg" id="fLive" role="group" aria-label="Liveness filter"></div>
  <span class="ctl">Hosts <span class="seg" id="fHost" role="group" aria-label="Host filter"></span></span>
  <span class="spacer"></span>
  <button class="switch" id="tDns" type="button" aria-pressed="true"><i></i>DNS names</button>
  <span class="ctl">Uptime <span class="seg" id="win" role="group" aria-label="Uptime window"></span></span>
</div>
<div class="legend" id="legend" aria-label="Legend"></div>
<div class="scroller" id="scroller" tabindex="-1">
  <div class="content" id="content">
    <div class="colhd" id="colhd"></div>
    <svg class="graph" id="graph" role="group" aria-label="Topology graph"></svg>
    <div class="card" id="card" hidden role="dialog" aria-label="Details"></div>
  </div>
</div>
<script src="data.js"></script>
<script src="nav.js"></script>
<script>
(() => {
const I = window.INV, F = I.fmt;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const LIVE = ["down", "warn", "up", "unknown"];
const WIN = { h24: "24h", d7: "7d", d30: "30d" };
const S = { q: "", live: new Set(), hosts: new Set(), dns: true, win: "d30", open: new Set(), sel: null, hover: null };
const ext = `<svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><path d="M5 2H2v8h8V7M7 1.5h3.5V5M10.5 1.5L5.5 6.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;

/* ---------- glyphs: a distinct shape per status ---------- */
function glyphBody(st) {
  const c = `var(--${st})`;
  return {
    up: `<circle cx="8" cy="8" r="7.5" fill="${c}"/><path d="M4.6 8.3l2.3 2.3 4.6-4.8" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>`,
    warn: `<path d="M8 1.2L15.3 14.4H.7z" fill="${c}" stroke="${c}" stroke-linejoin="round" stroke-width="1.2"/><path d="M8 5.8v4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="8" cy="12.2" r="1" fill="#fff"/>`,
    down: `<rect x=".8" y=".8" width="14.4" height="14.4" rx="3.5" fill="${c}"/><path d="M5.3 5.3l5.4 5.4M10.7 5.3l-5.4 5.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/>`,
    unknown: `<circle cx="8" cy="8" r="6.6" fill="var(--node)" stroke="${c}" stroke-width="1.8" stroke-dasharray="2.6 1.8"/><path d="M5.3 8h5.4" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/>`,
  }[st];
}
const glyph = (st, size = 13) => `<svg width="${size}" height="${size}" viewBox="0 0 16 16" role="img" aria-label="${I.liveness[st].label}" style="flex:none">${glyphBody(st)}</svg>`;
const sglyph = (st, x, y, size = 14) => `<g transform="translate(${x} ${y}) scale(${size / 16})">${glyphBody(st)}</g>`;

/* ---------- text fitting ---------- */
const ctx = document.createElement("canvas").getContext("2d");
function fit(text, maxW, font) {
  ctx.font = font;
  if (ctx.measureText(text).width <= maxW) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; ctx.measureText(text.slice(0, m) + "…").width <= maxW ? (lo = m) : (hi = m - 1); }
  return text.slice(0, lo) + "…";
}
const FONT = { lbl: "600 12.5px system-ui, sans-serif", big: "700 14.5px system-ui, sans-serif", dns: "500 12px system-ui, sans-serif", sub: "400 11px system-ui, sans-serif" };

/* ---------- DNS names of a service ---------- */
function namesOf(s, seen) {
  const out = [];
  const push = (name, rec, url) => {
    const e = out.find((x) => x.name === name);
    if (e) { e.rec ||= rec; e.url ||= url; return; }
    if (seen.has(name)) return;
    seen.add(name); out.push({ name, rec, url });
  };
  for (const d of s.dns) if (d.type === "A") push(d.name, d, null);
  for (const u of s.urls) push(u.host, s.dns.find((d) => d.name === u.host) || null, u);
  for (const d of s.dns) push(d.name, d, null);
  return out;
}

/* ---------- graph model + layout ---------- */
const C = { ROW: 32, NH: 26, GH: 44, HH: 132, UH: 28, GAPG: 10, GAPH: 30, TOP: 56, PAD: 20 };
const est = (p, c) => (p === "down" || c === "down" ? "down" : c);
let G = null;
function build() {
  const nodes = [], edges = [], bands = [], byId = new Map(), seen = new Set();
  const add = (n) => { nodes.push(n); byId.set(n.id, n); return n; };
  const edge = (from, to, kind, status) => edges.push({ id: `${from}>${to}`, from, to, kind, status });
  let y = C.TOP;
  const hosts = I.nodes.filter((h) => !S.hosts.size || S.hosts.has(h.id)).sort((a, b) => a.name.localeCompare(b.name));
  for (const host of hosts) {
    const h0 = y;
    const hn = add({ id: "h:" + host.id, type: "host", col: 0, ref: host, status: host.status, h: C.HH });
    for (const g of I.guestsOf(host.id).sort((a, b) => a.id.localeCompare(b.id))) {
      const g0 = y;
      const gn = add({ id: "g:" + g.id, type: "guest", col: 1, ref: g, status: g.status, h: C.GH, host: host.id });
      edge(hn.id, gn.id, "contain", est(host.status, g.status));
      for (const s of I.servicesOf(g.id)) {
        const s0 = y;
        const sn = add({ id: "s:" + s.id, type: "svc", col: 2, ref: s, status: s.status, h: C.NH });
        edge(gn.id, sn.id, "contain", est(g.status, s.status));
        if (S.dns) for (const d of namesOf(s, seen)) {
          const st = d.url ? d.url.check.status : "unknown";
          const dn = add({ id: "d:" + d.name, type: "dns", col: 3, ref: d, svc: s, status: st, h: C.NH, cy: y + C.ROW / 2 });
          edge(sn.id, dn.id, d.url ? "serve" : "declare", est(s.status, st));
          y += C.ROW;
        }
        if (y === s0) y += C.ROW;
        sn.cy = (s0 + y) / 2;
      }
      if (y - g0 < C.GH + 10) y = g0 + C.GH + 10;
      gn.cy = (g0 + y) / 2;
      y += C.GAPG;
    }
    if (host.unmanaged.length) {
      const open = S.open.has(host.id);
      const un = add({ id: "ug:" + host.id, type: "ug", col: 1, ref: host, status: "unknown", h: open ? 24 : C.UH, cy: y + (open ? 12 : C.UH / 2), open });
      edge(hn.id, un.id, "contain", "unknown");
      y += (open ? 24 : C.UH) + 6;
      if (open) for (const u of host.unmanaged) {
        const n = add({ id: `u:${host.id}:${u.vmid}`, type: "unm", col: 1, ref: u, host, status: "unknown", h: C.NH, cy: y + C.NH / 2, indent: 14 });
        edge(un.id, n.id, "contain", "unknown");

  if (n.type === "guest") {
    const g = n.ref, kind = g.kind === "lxc" ? "Container" : "VM";
    return `<div class="ch">${close}<div class="kick">${kind} · on ${esc(g.node)}</div><h2>${glyph(g.status, 16)}${esc(g.id)}</h2>
      <div class="pills">${pill(g.status)}<span class="pill">Run: ${I.runLabels[g.runStatus].label}</span><a class="lnk" href="${esc(I.proxmoxGuestUrl(g))}" target="_blank" rel="noopener">Proxmox ${ext}</a></div></div>
      ${uptime(g.check)}
      <div class="cs">${facts([["VMID", `<span class="mono">${g.vmid}</span> · ${kind}`], ["Address", g.address ? `<span class="mono">${esc(g.address)}</span>` : "—"], ["Hostname", `<span class="mono">${esc(g.hostname)}</span>`],
        ["Power", esc(g.power)], ["Resources", `${g.cores} cores · ${F.bytes(g.memory)} · ${F.bytes(g.disk)}`], ["Workflow", `<span class="mono">${esc(g.workflow)}</span>`],
        ["Last run", `${I.runLabels[g.lastRun.status].label} · ${F.ago(g.lastRun.at)}`], ["About", esc(g.description)], ["Services", String(I.servicesOf(g.id).length)]])}</div>`;
  }
  if (n.type === "svc") {
    const s = n.ref;
    return `<div class="ch">${close}<div class="kick">Service · ${esc(s.category)} · on ${esc(s.guest)}</div><h2>${glyph(s.status, 16)}${esc(s.name)}</h2>
      <div class="pills">${pill(s.status)}${s.runStatus !== "in-sync" ? `<span class="pill">Run: ${I.runLabels[s.runStatus].label}</span>` : ""}</div></div>
      ${s.urls.length ? `<div class="cs"><h3>Open</h3><ul class="urls">${s.urls.map((u) => `<li>${glyph(u.check.status, 12)}<a href="${esc(u.url)}" target="_blank" rel="noopener">${esc(u.url.replace("https://", ""))}</a><span class="mono" style="font-size:11px;color:var(--muted)">${F.pct(u.check.uptime[S.win])}</span></li>`).join("")}</ul></div>` : ""}
      ${uptime(s.check)}
      <div class="cs">${s.dns.length ? `<h3>DNS records</h3><table class="dns">${s.dns.map((d) => `<tr><td>${d.type}</td><td>${esc(d.name)} → <span class="mono">${esc(d.expected)}</span></td></tr>`).join("")}</table>` : `<h3>DNS records</h3><div class="note">None declared.</div>`}
      ${s.health ? `<div class="note">Health: <span class="mono">${esc(s.health.url)}</span>${s.health.probed ? "" : " (not probed)"}</div>` : ""}${s.notes.map((t) => `<div class="note">${esc(t)}</div>`).join("")}
      <div class="note">${esc(s.description)} · <span class="mono">${esc(s.workflow)}</span></div></div>`;
  }
  if (n.type === "dns") {
    const d = n.ref;
    return `<div class="ch">${close}<div class="kick">DNS name${d.rec ? " · " + d.rec.type + " record" : ""}</div><h2>${glyph(n.status, 16)}${esc(d.name)}</h2>
      <div class="pills">${pill(n.status)}${d.url ? `<a class="lnk" href="${esc(d.url.url)}" target="_blank" rel="noopener">Open ${ext}</a>` : ""}</div></div>
      ${requestPath(n)}
      ${d.url ? uptime(d.url.check, "URL check") : `<div class="cs"><div class="note">No URL check for this name${d.rec?.type === "A" ? "; it is the zone's entry point. Its CNAMEs are checked." : "."}</div></div>`}
      <div class="cs">${facts([["Record", d.rec ? `<span class="mono">${d.rec.type} → ${esc(d.rec.expected)}</span>` : "not declared"], d.rec && ["Zone", esc(d.rec.zone)], d.rec && ["Status", esc(d.rec.status)],
        d.url && ["URL", `<a href="${esc(d.url.url)}" target="_blank" rel="noopener">${esc(d.url.url)}</a>`], ["Service", `${esc(n.svc.name)} on ${esc(n.svc.guest)}`]])}</div>`;
  }
  if (n.type === "unm") {
    const u = n.ref, kind = u.kind === "lxc" ? "Container" : "VM";
    return `<div class="ch">${close}<div class="kick">Unmanaged ${kind} · on ${esc(n.host.name)}</div><h2>${glyph("unknown", 16)}${esc(u.name)}</h2>
      <div class="pills">${pill("unknown")}${u.template ? `<span class="badge">template</span>` : ""}<a class="lnk" href="${esc(I.proxmoxGuestUrl({ node: n.host.id, kind: u.kind, vmid: u.vmid }))}" target="_blank" rel="noopener">Proxmox ${ext}</a></div></div>
      <div class="cs"><div class="note">Not managed by Octopushy: no definition, run status or checks.</div></div>
      <div class="cs">${facts([["VMID", `<span class="mono">${u.vmid}</span> · ${kind}`], ["Status", esc(u.status)], ["Resources", `${u.cores} cores · ${F.bytes(u.memory)}`], ["Uptime", u.uptimeSeconds ? F.duration(u.uptimeSeconds) : "—"], ["Tags", u.tags.length ? u.tags.map(esc).join(", ") : "—"]])}</div>`;
  }
  return "";
}
function openCard(id, scroll = true) {
  const n = G.byId.get(id);
  if (!n || n.type === "ug") return;
  S.sel = id;
  card.innerHTML = cardHTML(n);
  card.hidden = false;
  const cw = 340, W = G.width;
  let x = n.x + n.w + 14;
  if (x + cw > W - 8) x = n.x - cw - 14;
  if (x < 8) x = Math.min(W - cw - 8, n.x + 20);
  const top = Math.max(40, n.y - 10);
  card.style.left = x + "px"; card.style.top = top + "px";
  applyHover(); writeHash();
  if (scroll) requestAnimationFrame(() => {
    const r = card.getBoundingClientRect(), s = scroller.getBoundingClientRect();
    if (r.bottom > s.bottom || r.top < s.top + 36) scroller.scrollBy({ top: r.top < s.top + 36 ? r.top - s.top - 44 : Math.min(r.bottom - s.bottom + 12, r.top - s.top - 44), behavior: "smooth" });
  });
}
function closeCard(update = true) {
  card.hidden = true;
  if (update) { const prev = S.sel; S.sel = null; applyHover(); writeHash(); els.get(prev)?.focus({ preventScroll: true }); }
}

/* ---------- chrome ---------- */
function seg(el, opts, cur, onPick) {
  if (el.children.length !== opts.length) el.innerHTML = opts.map(([v, l]) => `<button type="button" data-v="${v}">${l}</button>`).join("");
  for (const b of el.children) b.setAttribute("aria-pressed", cur(b.dataset.v));
  el.onclick = (e) => { const b = e.target.closest("button"); if (b) onPick(b.dataset.v); };
}
function renderChrome() {
  seg($("#fLive"), LIVE.map((s) => [s, `${glyph(s, 12)}${I.liveness[s].label}`]), (v) => S.live.has(v), (v) => { S.live.has(v) ? S.live.delete(v) : S.live.add(v); update(); });
  seg($("#fHost"), I.nodes.map((n) => [n.id, `${glyph(n.status, 11)}${n.name}`]), (v) => S.hosts.has(v), (v) => { S.hosts.has(v) ? S.hosts.delete(v) : S.hosts.add(v); update(true); });
  seg($("#win"), Object.entries(WIN), (v) => v === S.win, (v) => { S.win = v; update(true); });
  $("#tDns").setAttribute("aria-pressed", S.dns);
}
function update(relayout) { writeHash(); if (relayout) render(); else { applyFilter(); applyHover(); renderChrome(); } }
const edgeSample = (st, label) => `<span class="li"><svg width="30" height="10" aria-hidden="true"><path class="edge st-${st}" d="M1 5H29" style="opacity:1"/></svg>${label}</span>`;
$("#legend").innerHTML = `<span class="lnote">Read right to left to follow a request: name → CNAME → A record → guest → host.</span>` +
  LIVE.slice().reverse().map((s) => `<span class="li">${glyph(s, 12)}${I.liveness[s].label}</span>`).join("") +
  edgeSample("up", "up") + edgeSample("warn", "degraded") + edgeSample("down", "down") + edgeSample("unknown", "no check") +
  `<span class="li"><svg width="24" height="14" aria-hidden="true"><rect x="1" y="1" width="22" height="12" rx="3" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-dasharray="3 2"/></svg>unmanaged</span>`;

/* ---------- events ---------- */
svg.addEventListener("pointerover", (e) => {
  const g = e.target.closest(".node");
  const id = g?.dataset.id || null;
  if (id !== S.hover) { S.hover = id; applyHover(); }
});
svg.addEventListener("pointerleave", () => { S.hover = null; applyHover(); });
function activate(id) {
  const n = G.byId.get(id);
  if (!n) return;
  if (n.type === "ug") { S.open.has(n.ref.id) ? S.open.delete(n.ref.id) : S.open.add(n.ref.id); writeHash(); render(); els.get(id)?.focus({ preventScroll: true }); return; }
  if (S.sel === id) closeCard(); else openCard(id);
}
svg.addEventListener("click", (e) => {
  if (e.target.closest("[data-stop]")) return;
  const g = e.target.closest(".node");
  if (g) activate(g.dataset.id);
  else if (S.sel) closeCard();
});
svg.addEventListener("keydown", (e) => {
  const g = e.target.closest?.(".node");
  if (g && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); activate(g.dataset.id); }
});
svg.addEventListener("focusin", (e) => { const g = e.target.closest?.(".node"); if (g) { S.hover = g.dataset.id; applyHover(); } });
svg.addEventListener("focusout", () => { S.hover = null; applyHover(); });
document.addEventListener("click", (e) => {
  const a = e.target.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act === "close") closeCard();
  if (a.dataset.act === "clear") { S.q = ""; $("#q").value = ""; S.live.clear(); S.hosts.clear(); update(true); }
});
$("#tDns").addEventListener("click", () => { S.dns = !S.dns; update(true); });
$("#q").addEventListener("input", (e) => { S.q = e.target.value.trim().toLowerCase(); update(); revealHit(); });
// bring the first match into view when it is off screen
function revealHit() {
  const el = S.q && svg.querySelector(".node.hit");
  if (!el) return;
  const r = el.getBoundingClientRect(), s = scroller.getBoundingClientRect();
  if (r.top < s.top + 40 || r.bottom > s.bottom) scroller.scrollBy({ top: r.top - s.top - 120, behavior: "smooth" });
}
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); }
  else if (e.key === "Escape" && !card.hidden) closeCard();
});
// drag to pan on empty canvas
let drag = null;
scroller.addEventListener("pointerdown", (e) => {
  if (e.button !== 0 || e.target.closest(".node, .card, a, button")) return;
  drag = { x: e.clientX, y: e.clientY, sl: scroller.scrollLeft, st: scroller.scrollTop, moved: false };
});
addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; scroller.classList.add("grab");
  scroller.scrollLeft = drag.sl - dx; scroller.scrollTop = drag.st - dy;
});
addEventListener("pointerup", () => { if (drag?.moved) { const stop = (ev) => { ev.stopPropagation(); }; addEventListener("click", stop, { capture: true, once: true }); setTimeout(() => removeEventListener("click", stop, { capture: true }), 0); } drag = null; scroller.classList.remove("grab"); });
let lastW = 0;
new ResizeObserver(() => { if (scroller.clientWidth !== lastW) { lastW = scroller.clientWidth; render(); } }).observe(scroller);

/* ---------- hash state ---------- */
function writeHash() {
  const p = new URLSearchParams();
  if (S.q) p.set("q", S.q);
  if (S.sel) p.set("select", S.sel);
  if (!S.dns) p.set("dns", "0");
  if (S.open.size) p.set("open", [...S.open].join(","));
  if (S.live.size) p.set("live", [...S.live].join(","));
  if (S.hosts.size) p.set("hosts", [...S.hosts].join(","));
  const h = p.toString().replace(/%2C/g, ",").replace(/%3A/g, ":");
  history.replaceState(null, "", h ? "#" + h : location.pathname);
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  S.q = (p.get("q") || "").toLowerCase(); $("#q").value = S.q;
  S.sel = p.get("select");
  S.dns = p.get("dns") !== "0";
  for (const id of (p.get("open") || "").split(",")) if (I.nodeById[id]) S.open.add(id);
  for (const l of (p.get("live") || "").split(",")) if (LIVE.includes(l)) S.live.add(l);
  for (const id of (p.get("hosts") || "").split(",")) if (I.nodeById[id]) S.hosts.add(id);
}

/* ---------- header ---------- */
const T = I.totals();
$("#rev").innerHTML = `rev <code>${esc(I.revision.commit)}</code> ${esc(I.revision.subject)} · observed ${F.ago(I.observedAt)}`;
$("#totals").innerHTML = [
  [`${T.nodes.up}/${T.nodes.total}`, "hosts up", T.nodes.down ? "down" : "up"],
  [`${T.guests.up}/${T.guests.total}`, "guests up", T.guests.down ? "down" : "up"],
  [T.services.total, `services · ${T.services.up} up · ${T.services.warn} degraded · ${T.services.down} down · ${T.services.unknown} no check`, T.services.down ? "down" : T.services.warn ? "warn" : "up"],
  [T.unmanaged, "unmanaged", null],
].map(([n, l, st]) => `<span class="t">${st ? glyph(st, 12) : ""}<b>${n}</b>${l}</span>`).join("");

readHash();
render();
revealHit();
})();
</script>
</body>
</html>
