<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline</title>
<!--
  04 · Timeline. The page answers "what happened to this, and what happens next". The main column
  is one vertical time axis: what is coming sits above a "Now" marker (the next schedules, a run
  that waits for approval, with Approve and Reject), then the past grouped by day, newest first
  (runs, changes, uptime incidents, secret and key rotations, observations). Every event has the
  same layout: time, a toned dot on the axis, title, one detail line. A run opens in place to show
  its stage track and duration; a change shows the value before and after. Chips filter by type.
  Beside the axis a sticky narrow panel is "the state now": status, the few facts that define the
  thing, the actions, and "View definition", which opens the readable definition in the drawer
  with a "Readable / YAML" switch. For the node, the events are its guests' runs, observations and
  the trust, and a chip says which guest each one is about.
  Sample data: none. Filter and open run are kept in the URL hash (#filter=runs&open=e3).
-->
<link rel="icon" href="../../frontend/public/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../frontend/src/styles/tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
.hd { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; margin-bottom: var(--space-6); }
.hd h1 { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-1) 0 0; font-size: var(--text-2xl); }
.hd__kind { font-size: var(--text-sm); font-weight: 500; color: var(--text-muted); }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 20rem; gap: var(--space-8); align-items: start; }

/* ---- Filter chips ---- */
.filters { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-5); }
.fchip { display: inline-flex; align-items: center; gap: var(--space-2); height: 2rem; padding: 0 var(--space-3); border: 1px solid var(--border-strong); border-radius: 999px; background: transparent; color: var(--text-muted); font-size: var(--text-sm); }
.fchip:hover { color: var(--text); background: var(--surface-3); }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.fchip .num { color: var(--text-faint); }

/* ---- The axis ---- */
.tl { --time: 5.5rem; --axis: 2rem; position: relative; }
.tl::before { content: ""; position: absolute; left: calc(var(--time) + var(--axis) / 2 - 1px); top: 0.5rem; bottom: 0; width: 2px; background: var(--border); }
.tl__day { display: grid; grid-template-columns: var(--time) var(--axis) minmax(0, 1fr); margin: var(--space-6) 0 var(--space-2); }
.tl__day span { grid-column: 3; font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); }
.tl__label { display: grid; grid-template-columns: var(--time) var(--axis) minmax(0, 1fr); margin-bottom: var(--space-2); }
.tl__label span { grid-column: 3; font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); }
.ev { display: grid; grid-template-columns: var(--time) var(--axis) minmax(0, 1fr); align-items: start; position: relative; }
.ev__time { padding-top: var(--space-3); text-align: right; padding-right: var(--space-3); font-size: var(--text-sm); color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev__dot { display: grid; justify-items: center; padding-top: calc(var(--space-3) + 0.3rem); }
.ev__dot i { display: block; width: 0.75rem; height: 0.75rem; border-radius: 50%; background: var(--tone-fg); box-shadow: 0 0 0 3px var(--bg); position: relative; z-index: 1; }
.ev__dot i[data-hollow] { background: var(--bg); box-shadow: 0 0 0 3px var(--bg), inset 0 0 0 2px var(--tone-fg); }
.ev__body { min-width: 0; padding: var(--space-2) var(--space-3); margin: 2px 0; border-radius: var(--radius); }
.ev__head { display: flex; align-items: center; gap: var(--space-2); min-width: 0; width: 100%; padding: 0; border: 0; background: none; text-align: left; color: var(--text); font-weight: 550; }
.ev__head svg.chev { color: var(--text-faint); transition: transform 0.12s; margin-left: auto; }
button.ev__head:hover svg.chev { color: var(--text); }
.ev.is-open .ev__head svg.chev { transform: rotate(90deg); }
.ev__type { color: var(--text-faint); display: inline-flex; }
.ev__detail { font-size: var(--text-sm); color: var(--text-muted); margin-top: 1px; }
.ev--clickable .ev__body:hover { background: var(--surface-2); }
.ev.is-open .ev__body { background: var(--surface); border: 1px solid var(--border); padding: var(--space-3); margin: var(--space-1) 0 var(--space-2); }
.ev__more { margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); display: grid; gap: var(--space-3); }
.stages { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.stage { display: flex; flex-direction: column; gap: var(--space-1); font-size: var(--text-xs); color: var(--text-muted); }
.stage .track__segment { width: 5rem; }
.ev__facts { display: flex; gap: var(--space-2) var(--space-5); flex-wrap: wrap; font-size: var(--text-sm); color: var(--text-muted); align-items: center; }
.ev__facts b { color: var(--text); font-weight: 550; }
.change { display: inline-grid; grid-template-columns: auto auto auto; gap: var(--space-1) var(--space-3); align-items: center; margin-top: var(--space-2); padding: var(--space-2) var(--space-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
.change small { font-size: var(--text-xs); color: var(--text-muted); }
.change__v { font-family: var(--font-mono); font-size: var(--text-md); }
.change__v--old { color: var(--text-muted); }
.change svg { color: var(--text-muted); }
.upcoming .ev__body { border: 1px dashed var(--border-strong); margin: var(--space-1) 0; }
.upcoming .ev--waiting .ev__body { border: 1px solid var(--attention-border); background: var(--attention-bg); }
.ev__actions { display: flex; gap: var(--space-2); margin-top: var(--space-3); flex-wrap: wrap; }
.now { display: grid; grid-template-columns: var(--time) var(--axis) minmax(0, 1fr); align-items: center; margin: var(--space-4) 0 0; }
.now__pill { grid-column: 1 / 3; justify-self: end; margin-right: calc(var(--axis) / 2 - 1.6rem); position: relative; z-index: 1; padding: 0.1rem 0.6rem; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-size: var(--text-xs); font-weight: 600; }
.now__line { height: 2px; background: var(--accent); margin-left: var(--space-2); }
.empty { padding: var(--space-6) 0 var(--space-6) calc(5.5rem + 2rem + var(--space-3)); color: var(--text-muted); }

/* ---- The state now ---- */
.state { position: sticky; top: var(--space-5); display: flex; flex-direction: column; gap: var(--space-5); padding: var(--space-5); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); }
.state h2 { font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); }
.state__status { display: flex; flex-direction: column; gap: var(--space-2); }
.state__status p { font-size: var(--text-sm); color: var(--text-muted); }
.sfacts > div { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--border); align-items: baseline; }
.sfacts dt { color: var(--text-muted); font-size: var(--text-sm); }
.sfacts dd { min-width: 0; overflow-wrap: anywhere; }
.sfacts .meter { margin-top: var(--space-1); }
.sfacts small { display: block; font-size: var(--text-xs); color: var(--text-muted); }
.state__actions { display: flex; flex-direction: column; gap: var(--space-2); }
.state__actions .button { width: 100%; justify-content: flex-start; }

/* ---- Drawer: the readable definition ---- */
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); }
.seg button { border: 0; background: none; padding: 0.25rem 0.8rem; border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--text-sm); font-weight: 550; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.dbar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.dsec { padding: var(--space-4) 0; border-top: 1px solid var(--border); }
.dsec:first-child { border-top: 0; padding-top: 0; }
.dsec h3 { display: flex; align-items: center; gap: var(--space-2); font-size: var(--text-md); margin-bottom: var(--space-2); }
.dsec h3 svg { color: var(--text-muted); }
.dsec p { color: var(--text-muted); font-size: var(--text-sm); margin-bottom: var(--space-2); }
.drow { display: grid; grid-template-columns: 10rem minmax(0, 1fr); gap: var(--space-3); padding: var(--space-1) 0; }
.drow dt { color: var(--text-muted); }
.drow dd { min-width: 0; overflow-wrap: anywhere; }
.drow small { display: block; font-size: var(--text-xs); color: var(--text-muted); }

@media (max-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 1fr) 17rem; gap: var(--space-5); }
  .tl { --time: 4.5rem; }
}
@media (max-width: 900px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .state { position: static; order: -1; }
}
</style>
</head>
<body>
<script src="kit.js"></script>
<script src="nav.js"></script>
<script>
const { res, esc, icon } = RD;
const kind = RD.kind;
const main = RD.mount();
const def = res.definition;
const up = res.checks[0];
const runOf = (n) => res.runs.find((r) => r.number === n);
const DAY = 86400000;

// ---- Types and filters -----------------------------------------------------------------
const TYPE_ICON = { run: "runs", schedule: "calendar", change: "commit", uptime: "activity", secret: "key", key: "key", trust: "shield", observe: "eye" };
const FILTERS = [["all", "All", () => true], ["runs", "Runs", (e) => ["run", "schedule"].includes(e.type)], ["changes", "Changes", (e) => e.type === "change"], ["uptime", "Uptime", (e) => e.type === "uptime"], ["secrets", "Secrets and keys", (e) => ["secret", "key", "trust"].includes(e.type)]];

/** Which guest an event is about, for the node. */
function about(e) {
  if (kind !== "node") return null;
  const r = e.run && runOf(e.run);
  return r?.address ? r.address.split("/").pop() : res.name;
}

// ---- What comes next, above "Now" -------------------------------------------------------
function upcoming() {
  const list = [];
  const waiting = res.runs.find((r) => r.status === "awaiting-approval");
  if (waiting) list.push({ id: "u-wait", type: "run", tone: "attention", waiting: true, run: waiting.number,
    time: "waiting", title: `${waiting.title} #${waiting.number} waits for approval`,
    detail: `${waiting.detail} · since ${RD.rel(waiting.createdAt)} · ${waiting.by ? `change by ${waiting.by}` : waiting.reason.toLowerCase()}` });
  const m = RD.data.machine;
  if (kind !== "service") {
    const auto = new Set(m.policy.actions.filter((a) => a.approval === "automatic").map((a) => a.action));
    [...m.configuration.schedules].sort((a, b) => a.nextAt.localeCompare(b.nextAt)).forEach((s) => list.unshift({
      id: `u-${s.action}`, type: "schedule", tone: "neutral", hollow: true, time: RD.rel(s.nextAt), guest: kind === "node" ? m.name : null,
      title: `${s.action} is scheduled`, detail: `${s.human} · ${auto.has(s.action) ? "runs on its own" : "waits for approval when it starts"}` }));
  }
  // Furthest on top; the soonest sits just above "Now", and the waiting run is closest of all.
  return list;
}

// ---- The past ---------------------------------------------------------------------------
const past = res.events.filter((e) => e.type !== "schedule" && !(e.run && runOf(e.run)?.status === "awaiting-approval"))
  .map((e, i) => ({ ...e, id: `e${i + 1}`, guest: about(e) }))
  .sort((a, b) => b.at.localeCompare(a.at));

function dayLabel(iso) {
  const d = new Date(iso), today = new Date(RD.NOW);
  const diff = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / DAY);
  return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : RD.day(iso);
}
const hhmm = (iso) => new Date(iso).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

/** "Memory 4096 → 8192 MiB" becomes a before and after. */
function change(e) {
  const m = e.title.match(/^(.*?)\s(\S+)\s→\s(\S+)(.*)$/);
  if (!m) return "";
  const [, what, before, after, unit] = m;
  const f = def.sections.flatMap((s) => s.fields.map((x) => ({ ...x, sid: s.id }))).find((x) => x.label.toLowerCase() === what.toLowerCase());
  return `<div class="change"><small>Before</small><span></span><small>After</small>
    <span class="change__v change__v--old">${esc(before)}${esc(unit)}</span>${icon("arrowRight", 14)}<span class="change__v">${esc(after)}${esc(unit)}</span></div>
    ${f ? ` <button type="button" class="link-button small" data-yaml="${f.sid}">${esc(what.toLowerCase())}, line ${f.line}</button>` : ""}`;
}
function runMore(r) {
  return `<div class="ev__more">
    <div class="stages">${r.steps.map((s) => `<div class="stage"><span class="track__segment track__segment--${s.status === "todo" ? "todo" : RD.tone(s.status)}"></span><span>${esc(s.name)}</span></div>`).join("")}</div>
    <div class="ev__facts">${RD.status(r.status)}<span>Took <b>${RD.duration(r.seconds)}</b></span><span>${esc(r.reason)}</span><span>${RD.commit(r.commit)}</span><a href="#" style="margin-left:auto">Open run #${r.number}</a></div>
  </div>`;
}

function eventHtml(e, open) {
  const r = e.run && runOf(e.run);
  const expandable = !!r && !e.waiting;
  const head = `${icon(TYPE_ICON[e.type] ?? "circleDot", 14).replace("<svg", '<svg class="ev__type-i"')}`;
  const title = `<span class="ev__type">${head}</span><span class="truncate">${esc(e.guest ? e.title.replace(` of ${e.guest}`, "") : e.title)}</span>${e.guest ? RD.chip(e.guest, { mono: true }) : ""}${r && !e.waiting ? `<span class="xs muted num">#${r.number}</span>` : ""}`;
  const body = `${expandable ? `<button type="button" class="ev__head" aria-expanded="${open}" data-open="${e.id}">${title}${icon("chevronRight", 14).replace("<svg", '<svg class="chev"')}</button>` : `<div class="ev__head">${title}</div>`}
    <div class="ev__detail">${esc(e.detail)}</div>
    ${e.type === "change" ? change(e) : ""}
    ${e.waiting ? `${r ? `<div class="stages" style="margin-top:var(--space-3)">${r.steps.map((s) => `<div class="stage"><span class="track__segment track__segment--${s.status === "todo" ? "todo" : RD.tone(s.status)}"></span><span>${esc(s.name)}</span></div>`).join("")}</div>` : ""}
      <div class="ev__actions"><button type="button" class="button button--small button--primary" data-action="approve">${icon("check", 14)}Approve</button><button type="button" class="button button--small" data-action="reject">${icon("x", 14)}Reject</button></div>` : ""}
    ${expandable && open ? runMore(r) : ""}`;
  return `<div class="ev${expandable ? " ev--clickable" : ""}${open ? " is-open" : ""}${e.waiting ? " ev--waiting" : ""}" data-ev="${e.id}">
    <div class="ev__time">${e.time ?? hhmm(e.at)}</div>
    <div class="ev__dot"><i data-tone="${e.tone}"${e.hollow ? " data-hollow" : ""}></i></div>
    <div class="ev__body">${body}</div></div>`;
}

// ---- The state now (side) ----------------------------------------------------------------
function facts() {
  const rows = {
    machine: () => [
      ["Power", `Running<small>up ${RD.duration(res.observed.uptimeSeconds)}</small>`],
      ["Size", `${res.observed.maxCpu} vCPU · ${RD.bytes(res.observed.maxMemoryBytes)}<small>300 GiB disk</small>`],
      ["Address", `<span class="mono">${res.accessAddress}</span><small>static on vmbr1</small>`],
      ["Lives on", `<a href="${RD.href("node")}">${esc(res.host)}</a><small>VM ${res.vmid} · ${esc(res.template)}</small>`],
      ["Workflow", `<span class="mono">${esc(res.configuration.workflow)}</span>`],
      ["Git", `${RD.commit(res.revisions.desiredCommit)}<small>checked ${RD.rel(res.revisions.checkedAt)}</small>`],
    ],
    service: () => [
      ["Link", `<a href="#" class="mono truncate" style="display:block" title="${esc(res.names[0].name)}">${esc(res.names[0].name)}</a><small>${RD.statusLabel(up.status)} · ${up.elapsedMs} ms</small>`],
      ["Uptime", `${up.uptime.month}%<small>30 days</small>`],
      ["Image", `<span class="mono">0.6.30</span><small>0.6.34 waits for approval</small>`],
      ["Runs on", `<a href="${RD.href("machine")}">${esc(res.guest.name)}</a><small class="mono">${res.guest.accessAddress}</small>`],
      ["Workflow", `<span class="mono">compose@${res.workflow.resolved}</span><small>${res.workflow.latest} is available</small>`],
      ["Deployed", `${RD.commit(res.appliedCommit)}<small>${RD.rel(res.appliedAt)}</small>`],
    ],
    node: () => { const h = res.hosts[0]; return [
      ["Proxmox VE", `${res.proxmoxVersion}<small>${esc(res.type)} · observed ${RD.rel(res.observedAt)}</small>`],
      ["Host", `Online<small>up ${RD.duration(h.uptimeSeconds)}</small>`],
      ["CPU", `${RD.pct(h.cpu)} of ${h.maxCpu} cores${RD.meter(h.cpu)}`],
      ["Memory", `${RD.bytes(h.memoryBytes)} of ${RD.bytes(h.maxMemoryBytes)}${RD.meter(h.memoryBytes / h.maxMemoryBytes)}`],
      ["Guests", `${res.guests.length} managed<small>${res.unmanaged.length} unmanaged</small>`],
      ["TLS", `${RD.badge("Not verified", "warning", "alert")}<small>${esc(res.issues[0].message.split(":")[0])}</small>`],
    ]; },
  }[kind]();
  return `<dl class="sfacts">${rows.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
}
function stateNow() {
  return `<aside class="state" aria-label="The state now">
    <div class="state__status"><h2>The state now</h2><div>${RD.status(res.status)}</div><p>${esc(res.statusDetail ?? "Matches its definition.")}</p></div>
    ${facts()}
    <div class="state__actions">${RD.actions()}<button type="button" class="button" data-def>${icon("file", 15)}View definition</button></div>
  </aside>`;
}

// ---- The definition in the drawer: readable first, YAML behind a switch -----------------------
function readable() {
  return def.sections.map((s) => `<section class="dsec"><h3>${icon(s.icon, 15)}${esc(s.title)}</h3>${s.note ? `<p>${esc(s.note)}</p>` : ""}<dl>${s.fields.map((f) => `
    <div class="drow"><dt>${esc(f.label)}</dt><dd>${RD.value(f)}${f.pending ? ` ${RD.badge(f.pending, "attention")}` : ""}${f.note || f.raw ? `<small>${esc(f.note ?? f.raw)}</small>` : ""}</dd></div>`).join("")}</dl></section>`).join("");
}
function showDefinition() {
  const el = RD.drawer("Definition", `<div class="dbar"><div class="seg" role="group" aria-label="View"><button type="button" aria-pressed="true" data-view="readable">Readable</button><button type="button" aria-pressed="false" data-view="yaml">YAML</button></div><span class="xs muted mono truncate">${esc(def.file.split("/").pop())}</span></div><div data-defbody>${readable()}</div>`);
  el.addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (!b) return;
    el.querySelectorAll("[data-view]").forEach((x) => x.setAttribute("aria-pressed", x === b));
    el.querySelector("[data-defbody]").innerHTML = b.dataset.view === "yaml" ? RD.yamlBox(def) : readable();
  });
}

// ---- Render ------------------------------------------------------------------------------
const UP = upcoming();
const state = { filter: "all", open: new Set() };
{
  const p = new URLSearchParams(location.hash.slice(1));
  if (FILTERS.some((f) => f[0] === p.get("filter"))) state.filter = p.get("filter");
  if (p.has("open")) p.get("open").split(",").filter(Boolean).forEach((id) => state.open.add(id));
  else { const first = past.find((e) => e.run); if (first) state.open.add(first.id); }
}
function saveHash() {
  const p = new URLSearchParams();
  if (state.filter !== "all") p.set("filter", state.filter);
  p.set("open", [...state.open].join(","));
  history.replaceState(null, "", `${location.pathname}${location.search}#${p}`);
}

main.innerHTML = `
  <div class="hd">
    <div>
      <div class="eyebrow">${RD.crumbs()}</div>
      <h1>${kind === "service" ? RD.svcIcon(res.name, true) : ""}<span>${esc(res.name)}</span><span class="hd__kind">${esc(res.noun)}</span></h1>
      <p class="muted" style="margin-top:var(--space-1)">${esc(res.description)}</p>
    </div>
  </div>
  <div class="cols">
    <div>
      <div class="filters" role="group" aria-label="Show">${FILTERS.map(([id, label, test]) => `<button type="button" class="fchip" data-filter="${id}">${label}<span class="num">${[...UP, ...past].filter(test).length}</span></button>`).join("")}</div>
      <div class="tl" id="tl"></div>
    </div>
    ${stateNow()}
  </div>`;

const tl = main.querySelector("#tl");
function render() {
  const test = FILTERS.find((f) => f[0] === state.filter)[2];
  main.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.filter === state.filter));
  const next = UP.filter(test), done = past.filter(test);
  let html = "";
  if (next.length) html += `<div class="upcoming"><div class="tl__label"><span>Next</span></div>${next.map((e) => eventHtml(e, false)).join("")}</div>`;
  html += `<div class="now"><span class="now__pill">Now</span><span class="now__line"></span></div>`;
  let last = null;
  for (const e of done) {
    const d = dayLabel(e.at);
    if (d !== last) { html += `<div class="tl__day"><span>${d}</span></div>`; last = d; }
    html += eventHtml(e, state.open.has(e.id));
  }
  if (!done.length) html += `<p class="empty">Nothing of this type in the last 30 days.</p>`;
  tl.innerHTML = html;
}
main.addEventListener("click", (e) => {
  if (e.target.closest('a[href="#"]')) e.preventDefault();
  const f = e.target.closest("[data-filter]");
  if (f) { state.filter = f.dataset.filter; render(); saveHash(); return; }
  if (e.target.closest("[data-def]")) { showDefinition(); return; }
  const o = e.target.closest("[data-open]");
  if (o) {
    const id = o.dataset.open;
    state.open.has(id) ? state.open.delete(id) : state.open.add(id);
    render(); saveHash();
    tl.querySelector(`[data-open="${id}"]`)?.focus();
  }
});
render();
</script>
</body>
