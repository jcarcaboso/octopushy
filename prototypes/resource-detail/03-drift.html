<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Declared and observed</title>
<!--
  03 · Declared and observed. The GitOps question is "does reality match what I declared?", so the
  page is one comparison. One line on top states the result; under it a table with fixed columns:
  Property, Declared (from the definition in Git), Observed (what Proxmox, the guest or the link check
  reports) and a mark. Rows are grouped by the definition's sections. A property that exists on one
  side only shows a quiet dash, not a false mismatch. "Differences only" filters the table. A row
  opens to show the YAML line it comes from, highlighted in context; the whole file is in the drawer.
  Things that are not a comparison (policy, runs) sit in a narrow column beside it.
  Sample data: the machine's observed disk size and the node's datastores come from `sample`
  (Proxmox reports them, the API does not carry them today). The declared disk of mrb-crt-01 is read
  from the detail of its waiting apply #213.
-->
<link rel="icon" href="../../frontend/public/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../frontend/src/styles/tokens.css">
<link rel="stylesheet" href="kit.css">
<style>
.hd { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.hd h1 { display: flex; align-items: center; gap: var(--space-3); margin: var(--space-1) 0 var(--space-2); font-size: var(--text-2xl); }
.hd__kind { font-size: var(--text-sm); font-weight: 500; color: var(--text-muted); }

.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--space-1) var(--space-4); align-items: center; margin: var(--space-6) 0 var(--space-5); padding: var(--space-4) var(--space-5); border: 1px solid var(--tone-border); border-radius: var(--radius-lg); background: var(--tone-bg); }
.verdict > svg { color: var(--tone-fg); grid-row: span 2; }
.verdict__line { font-size: var(--text-lg); font-weight: 600; }
.verdict__meta { grid-column: 2; color: var(--text-muted); font-size: var(--text-sm); display: flex; gap: var(--space-2) var(--space-4); flex-wrap: wrap; align-items: center; }
.verdict__actions { grid-row: 1 / span 2; grid-column: 3; display: flex; gap: var(--space-2); }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 17rem; gap: var(--space-6); align-items: start; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); }
.seg button { border: 0; background: none; padding: 0.25rem 0.8rem; border-radius: var(--radius-sm); color: var(--text-muted); font-size: var(--text-sm); font-weight: 550; display: inline-flex; gap: var(--space-2); align-items: center; }
.seg button[aria-pressed="true"] { background: var(--surface-3); color: var(--text); }
.tally { display: flex; gap: var(--space-4); font-size: var(--text-sm); color: var(--text-muted); flex-wrap: wrap; }
.tally span { display: inline-flex; align-items: center; gap: var(--space-1); }

.cmp { width: 100%; border-collapse: collapse; table-layout: fixed; }
.cmp col.c-prop { width: 26%; }
.cmp col.c-mark { width: 8.5rem; }
.cmp thead th { position: sticky; top: 0; z-index: 2; background: var(--surface); text-align: left; font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.cmp thead th small { display: block; text-transform: none; letter-spacing: 0; font-size: var(--text-xs); color: var(--text-faint); font-weight: 400; }
.grp td { padding: var(--space-5) var(--space-4) var(--space-2); border-bottom: 1px solid var(--border); }
.grp:first-child td { padding-top: var(--space-3); }
.grp__in { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
.grp__title { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; }
.grp__title svg { color: var(--text-muted); }
.grp__src { font-size: var(--text-xs); color: var(--text-muted); }
.r td { padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); vertical-align: top; min-width: 0; overflow-wrap: anywhere; }
.r td:first-child { box-shadow: inset 2px 0 0 var(--edge, transparent); }
.r[data-mark="differs"] { --edge: var(--attention-fg); }
.r[data-mark="warning"] { --edge: var(--warning-fg); }
.r[data-mark="failed"] { --edge: var(--danger-fg); }
.r[data-mark="undeclared"] { --edge: var(--neutral-border); }
.r:hover td { background: var(--surface-2); }
.r.is-open td { background: var(--surface-2); border-bottom-color: transparent; }
.prop { display: flex; align-items: flex-start; gap: var(--space-2); width: 100%; padding: 0; border: 0; background: none; text-align: left; color: var(--text); }
.prop svg { color: var(--text-faint); margin-top: 3px; transition: transform 0.12s; }
.r.is-open .prop svg { transform: rotate(90deg); }
.prop__key { display: block; max-width: 100%; font-size: var(--text-xs); color: var(--text-faint); font-family: var(--font-mono); }
.prop--static { padding-left: 1.5rem; cursor: default; }
.val { min-width: 0; }
.val__sub { display: block; font-size: var(--text-xs); color: var(--text-muted); margin-top: 2px; }
.val--diff { font-weight: 600; color: var(--attention-fg); }
.dash { color: var(--text-faint); }
.mark { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); color: var(--tone-fg); white-space: nowrap; }
.mark--match { color: var(--success-fg); }
.mark--quiet { color: var(--text-faint); }
.x td { padding: 0 var(--space-4) var(--space-4); border-bottom: 1px solid var(--border); background: var(--surface-2); }
.x__in { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-2) var(--space-4); align-items: start; }
.x__in .code { grid-column: 1 / -1; }
.x__file { font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono); }
.x__why { color: var(--text-muted); font-size: var(--text-sm); }
.empty td { padding: var(--space-8) var(--space-4); text-align: center; color: var(--text-muted); }

.side { display: flex; flex-direction: column; gap: var(--space-6); position: sticky; top: var(--space-5); }
.side h2 { font-size: var(--text-sm); font-weight: 600; color: var(--text-muted); margin-bottom: var(--space-2); }
.side__list > li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 var(--space-3); padding: var(--space-2) 0; border-top: 1px solid var(--border); align-items: baseline; }
.side__list > li:last-child { border-bottom: 1px solid var(--border); }
.side__sub { grid-column: 1 / -1; font-size: var(--text-xs); color: var(--text-muted); }

@media (max-width: 1100px) {
  .cols { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); }
  .cmp col.c-prop { width: 30%; }
}
@media (max-width: 720px) {
  .verdict { grid-template-columns: auto minmax(0, 1fr); }
  .verdict__actions { grid-column: 1 / -1; grid-row: auto; }
}
</style>
</head>
<body>
<script src="kit.js"></script>
<script src="nav.js"></script>
<script>
const { res, esc, icon } = RD;
const kind = RD.kind;
const main = RD.mount();
const def = res.definition;
const up = res.checks[0];
const sec = (id) => def.sections.find((s) => s.id === id);
const fld = (sid, key) => sec(sid).fields.find((f) => f.key === key);
const DASH = `<span class="dash" title="Not on this side">—</span>`;
const mono = (s) => `<span class="mono">${esc(s)}</span>`;
const sub = (s) => `<span class="val__sub">${s}</span>`;

// A row: { id, label, key, declared, observed, mark, line, file, text, why }.
// mark: match | differs | warning | failed | undeclared | one (only one side has it).
let n = 0;
function row(sid, key, observed, extra = {}) {
  const f = sid && key ? fld(sid, key) : null;
  return {
    id: `r${++n}`, label: f?.label ?? extra.label, key: f ? key : extra.key,
    declared: extra.declared ?? (f ? RD.value(f) : DASH), observed: observed ?? DASH,
    mark: extra.mark ?? (observed == null || (!f && !extra.declared) ? "one" : "match"),
    line: extra.line ?? f?.line ?? null, file: extra.file, text: extra.text, why: extra.why,
    approve: extra.approve, adopt: extra.adopt,
  };
}
const only = (label, observed, why) => row(null, null, observed, { label, mark: "one", why: why ?? "Reported only: the definition does not declare it." });

// ---- The comparison, per kind ------------------------------------------------------------
const GROUPS = {
  machine: () => {
    const o = res.observed, c = res.configuration, s = res.sample, inUse = Object.fromEntries(c.secrets.map((x) => [x.key, x]));
    const sched = Object.fromEntries(c.schedules.map((x) => [x.action, x]));
    return [
      { id: "placement", src: `Proxmox · ${RD.rel(res.revisions.checkedAt)}`, rows: [
        row("placement", "type", `VM${sub("qemu")}`),
        row("placement", "host", esc(o.host)),
        row("placement", "vmid", String(o.vmid)),
        row("placement", "template", null, { why: "Proxmox does not say which template a guest was cloned from." }),
        row("placement", "lifecycle", `Running${sub(`up ${RD.duration(o.uptimeSeconds)}`)}`),
      ] },
      { id: "hardware", src: "Proxmox", rows: [
        row("hardware", "cores", String(o.maxCpu)),
        row("hardware", "memory", RD.bytes(o.maxMemoryBytes)),
        row("hardware", "disks", `${RD.bytes(s.maxDiskBytes)}${sub(`${RD.bytes(s.diskBytes)} used · ${esc(res.outputs.disks.scsi0)}`)}`),
      ] },
      { id: "network", src: "Proxmox and the provision outputs", rows: [
        row("network", "bridge", null, { why: "Proxmox reports no bridge for a guest to Octopushy today." }),
        row("network", "mode", null),
        row("network", "address", `${mono(res.outputs.ipv4)}${sub("provision output")}`),
        row("network", "gateway", null),
        row("network", "dns", null),
        only("MAC address", mono(res.outputs.mac)),
      ] },
      { id: "inputs", src: `applied by ${c.appliedAction} at ${c.appliedCommit.slice(0, 7)}`, rows: sec("inputs").fields.map((f) => row("inputs", f.key, f.type === "url" ? `<span class="mono break">${esc(f.value)}</span>` : RD.value(f))) },
      { id: "secrets", src: "the versions the guest runs with", rows: sec("secrets").fields.map((f) => { const u = inUse[f.secret.key]; return row("secrets", f.key, `v${u.startedVersion} in use${sub(`active v${u.activeVersion}`)}`, { declared: `<span class="mono break small">${esc(f.secret.key)}</span>${sub(`v${f.secret.activeVersion}`)}` }); }) },
      { id: "access", src: "the SSH check", rows: [
        row("access", "address", `${mono(`${res.accessAddress}:22`)}${sub(`answers in ${up.elapsedMs} ms`)}`),
        row("access", "user", null, { why: "The check does not log in, so it cannot confirm the user." }),
      ] },
      { id: "schedules", src: "the scheduler", rows: sec("schedules").fields.map((f) => { const x = sched[f.key]; return row("schedules", f.key, `Next ${RD.rel(x.nextAt)}${sub(`last #${x.lastRunNumber} ${RD.statusLabel(x.lastRunStatus).toLowerCase()}`)}`, { declared: `${esc(f.value)}${sub(esc(f.raw))}` }); }) },
      { id: "reported", title: "Reported only", icon: "eye", src: "Proxmox", rows: [
        only("Tags", `<span class="chips">${o.tags.map((t) => RD.chip(t)).join("")}</span>`),
        only("Uptime", RD.duration(o.uptimeSeconds)),
      ] },
    ];
  },
  service: () => {
    const img = fld("inputs", "image");
    return [
      { id: "service", src: `the link check · ${RD.rel(up.checkedAt)}`, rows: [
        row("service", "description", null, { why: "A description lives in Git only." }),
        row("service", "links", `${RD.statusLabel(up.status)}${sub(`answers in ${up.elapsedMs} ms`)}`, { declared: `<span class="mono break">${esc(res.links[0])}</span>` }),
      ] },
      { id: "inputs", src: `deployed by #201 at ${res.appliedCommit.slice(0, 7)}`, rows: sec("inputs").fields.map((f) => {
        if (f.key === "image") return row("inputs", "image", `<span class="mono val--diff">0.6.30</span>${sub("ghcr.io/open-webui/open-webui")}`, {
          declared: `<span class="mono">0.6.34</span>${sub("ghcr.io/open-webui/open-webui")}`, mark: "differs",
          why: `Deploy #${res.pending.run} would bring it to 0.6.34. It waits for approval since ${RD.rel(res.pending.since)}: change by ${esc(res.pending.author)} at ${res.pending.commit.slice(0, 7)}.`, approve: true });
        if (f.key === "dns_name") return row("inputs", f.key, `${mono(res.names[0].name)}${sub(`set by the ${res.names[0].stage} stage`)}`, { declared: mono(f.value) });
        return row("inputs", f.key, mono(f.value), { declared: mono(f.value) });
      }) },
      { id: "secrets", src: "", rows: sec("secrets").fields.map((f) => row("secrets", f.key, null, { declared: `<span class="mono break small">${esc(f.secret.key)}</span>${sub(`v${f.secret.activeVersion}${f.note ? ` · ${esc(f.note.toLowerCase())}` : ""}`)}`, why: "Octopushy does not read back which version a service started with." })) },
      { id: "reported", title: "Reported only", icon: "eye", src: "the link check", rows: [
        only("Uptime, 30 days", `${up.uptime.month}%`),
        only("Latency now", `${up.elapsedMs} ms`),
      ] },
    ];
  },
  node: () => {
    const h = res.hosts[0], ds = Object.fromEntries(res.sample.datastores.map((d) => [d.name, d]));
    const dsLine = fld("hosts", "datastores").line, gfile = (g) => `labs/home/proxmox/moraband/guests/${g}/guest.yaml`;
    const m = RD.data.machine, mLine = m.definition.sections[0].fields.find((f) => f.key === "vmid").line;
    const guest = (g) => {
      const base = { label: g.name, key: `${g.kind === "VM" ? "VM" : "Container"} ${g.vmid}`, line: g.name === "falcon" ? mLine : null, file: gfile(g.name), text: g.name === "falcon" ? m.definition.text : null };
      const size = `${g.cores} vCPU · ${RD.bytes(g.memoryBytes)}`;
      if (g.status === "awaiting-approval") return row(null, null, `<span class="val--diff">disk 120 GiB</span>${sub(`running · ${size}`)}`, { ...base, declared: `disk 160 GiB${sub(size)}`, mark: "differs", why: `Apply #213 would grow the disk to 160 GiB. It waits for approval.`, approve: true });
      if (g.status === "failed") return row(null, null, `Stopped${sub(esc(g.statusDetail))}`, { ...base, declared: `Defined${sub(size)}`, mark: "failed", why: "The last run of this guest failed: SSH did not answer, so it was not configured." });
      return row(null, null, `Running${sub(size)}`, { ...base, declared: `Defined${sub(size)}` });
    };
    return [
      { id: "connection", src: `the Proxmox API · ${RD.rel(res.observedAt)}`, rows: [
        row("connection", "type", `Standalone${sub("no cluster")}`),
        row("connection", "endpoint", `Answers${sub(`Proxmox VE ${res.proxmoxVersion}`)}`, { declared: `<span class="mono break">${esc(res.endpoint)}</span>` }),
        row("connection", "tls", `Certificate not checked`, { declared: `verify: false${sub("tls.verify is false")}`, mark: "warning", why: esc(res.issues[0].message) }),
        row("connection", "readOnlyToken", `Works${sub(`observed ${RD.rel(res.observedAt)}`)}`, { declared: `<span class="mono break small">${esc(res.tokenKey)}</span>${sub("v2")}` }),
        row("connection", "privilegedToken", null, { declared: `<span class="mono break small">proxmox/moraband/privileged-token</span>${sub("v2")}`, why: "Used only when a change is applied; nothing to observe." }),
      ] },
      { id: "hosts", src: "Proxmox", rows: [
        row(null, null, `Online${sub(`up ${RD.duration(h.uptimeSeconds)}`)}`, { label: "Host", key: "moraband", declared: mono("moraband"), line: sec("hosts").line }),
        ...[["images", "local"], ["disks", "local-lvm"], ["snippets", "local"]].map(([role, name]) => row(null, null, `${mono(name)}${sub(`${RD.bytes(ds[name].usedBytes)} of ${RD.bytes(ds[name].totalBytes)}`)}`, { label: `Datastore for ${role}`, key: role, declared: mono(name), line: dsLine })),
        row("hosts", "bridges", null, { why: "Proxmox's network of a host is not read by Octopushy today." }),
        row("hosts", "limits", `${h.concurrentOperations} running${sub(`limit ${h.limit}`)}`),
      ] },
      { id: "snippets", src: "SSH to the host", rows: [
        row("snippets", "user", `${mono(res.snippets.user)}${sub(`reachable on ${res.snippets.hosts[0].name}`)}`, { declared: mono(res.snippets.user) }),
      ] },
      { id: "guests", title: "Guests", icon: "monitor", src: "their own definitions, against Proxmox", rows: res.guests.map(guest) },
      { id: "unmanaged", title: "Observed, not declared", icon: "eye", src: "Proxmox", rows: res.unmanaged.map((g) => row(null, null, `${g.status === "running" ? "Running" : "Stopped"}${sub(`${g.maxCpu} vCPU · ${RD.bytes(g.maxMemoryBytes)}${g.tags.length ? ` · ${g.tags.join(", ")}` : ""}`)}`, { label: g.name, key: `${g.template ? "Template" : g.kind} ${g.vmid}`, mark: "undeclared", why: "Proxmox runs it, no file in Git declares it. Adopt it to manage it, or leave it alone.", adopt: true })) },
    ];
  },
}[kind]();

const ROWS = GROUPS.flatMap((g) => g.rows);
const count = (m) => ROWS.filter((r) => r.mark === m).length;
const isDiff = (r) => !["match", "one"].includes(r.mark);

// ---- The result in one line ---------------------------------------------------------------
function verdict() {
  if (kind === "machine") return { tone: "success", icon: "circleCheck", line: "Everything matches what Git declares.",
    meta: [`Git at ${RD.commit(res.revisions.desiredCommit)}`, `checked ${RD.rel(res.revisions.checkedAt)}`, `${count("match")} properties match`, `${count("one")} on one side only`] };
  if (kind === "service") return { tone: "attention", icon: "hand", line: "One property differs: the image. Git says 0.6.34, falcon runs 0.6.30.",
    meta: [`Deploy #${res.pending.run} waits for approval`, `Git at ${RD.commit(res.pending.commit)}`, `deployed ${RD.commit(res.appliedCommit)}`, `${count("match")} properties match`],
    actions: `<button type="button" class="button" data-action="reject">${icon("x", 15)}Reject</button><button type="button" class="button button--primary" data-action="approve">${icon("check", 15)}Approve</button>` };
  return { tone: "warning", icon: "alert", line: `${count("undeclared")} guests are observed, not declared; TLS is a warning.`,
    meta: [`1 guest differs and waits for approval`, `1 guest failed`, `${count("match")} properties match`, `observed ${RD.rel(res.observedAt)}`],
    actions: `<button type="button" class="button" data-action="observe">${icon("eye", 15)}Observe now</button>` };
}

const MARK = {
  match: () => `<span class="mark mark--match" title="Matches">${icon("check", 16)}<span class="sr">Matches</span></span>`,
  differs: () => `<span class="mark" data-tone="attention">${icon("hand", 15)}Differs</span>`,
  warning: () => `<span class="mark" data-tone="warning">${icon("alert", 15)}Warning</span>`,
  failed: () => `<span class="mark" data-tone="danger">${icon("circleX", 15)}Failed</span>`,
  undeclared: () => `<span class="mark" data-tone="neutral">${icon("eye", 15)}Not declared</span>`,
  one: () => `<span class="mark mark--quiet" title="Only one side has it">—</span>`,
};

/** The YAML around one line, that line marked. */
function context(text, line, file) {
  const t = document.createElement("template");
  t.innerHTML = RD.yaml(text, { highlight: [line, line] });
  t.content.querySelectorAll(".yaml__line").forEach((l) => { const k = +l.dataset.line; if (k < line - 3 || k > line + 3) l.remove(); });
  return `<div class="code"><div class="code__bar"><span>${esc(file)} · line ${line}</span></div>${t.innerHTML}</div>`;
}
function expansion(r) {
  const text = r.text ?? (r.file ? null : def.text), file = r.file ?? def.file;
  const why = r.why ? `<p class="x__why">${r.why}</p>` : "";
  const acts = r.approve ? `<div class="row"><button type="button" class="button button--small" data-action="reject">Reject</button><button type="button" class="button button--small button--primary" data-action="approve">Approve</button></div>`
    : r.adopt ? `<button type="button" class="button button--small" data-action="adopt">Adopt</button>`
    : r.line && !r.file ? `<button type="button" class="button button--small" data-yaml="${GROUPS.find((g) => g.rows.includes(r)).id}">${icon("code", 13)}Whole file</button>` : "";
  let body;
  if (r.line && text) body = context(text, r.line, file);
  else if (r.file) body = `<p class="x__file">Declared in ${esc(r.file)}</p>`;
  else body = `<p class="x__file">Not in the definition</p>`;
  return `<div class="x__in"><div>${why}</div><div>${acts}</div>${body}</div>`;
}

// ---- Render -------------------------------------------------------------------------
const v = verdict();
main.innerHTML = `
  <div class="hd">
    <div>
      <div class="eyebrow">${RD.crumbs()}</div>
      <h1>${kind === "service" ? RD.svcIcon(res.name, true) : ""}<span>${esc(res.name)}</span><span class="hd__kind">${esc(res.noun)}</span></h1>
      <div class="row row--wrap">${RD.status(res.status)}<span class="muted">${esc(res.description)}</span></div>
    </div>
    <div class="row">${RD.actions()}</div>
  </div>
  <div class="verdict" data-tone="${v.tone}">${icon(v.icon, 22)}<div class="verdict__line">${v.line}</div>
    <div class="verdict__meta">${v.meta.map((x) => `<span>${x}</span>`).join("")}</div>${v.actions ? `<div class="verdict__actions">${v.actions}</div>` : ""}</div>
  <div class="cols">
    <div>
      <div class="bar">
        <div class="seg" role="group" aria-label="Show">
          <button type="button" data-filter="all">All <span class="muted num">${ROWS.length}</span></button>
          <button type="button" data-filter="diff">Differences only <span class="muted num">${ROWS.filter(isDiff).length}</span></button>
        </div>
        <div class="tally">
          <span>${icon("check", 14)}${count("match")} match</span>
          ${count("differs") ? `<span>${count("differs")} differ</span>` : ""}
          ${count("warning") ? `<span>${count("warning")} warning</span>` : ""}
          ${count("failed") ? `<span>${count("failed")} failed</span>` : ""}
          ${count("undeclared") ? `<span>${count("undeclared")} not declared</span>` : ""}
          <span>${count("one")} one side only</span>
        </div>
      </div>
      <div class="card"><table class="cmp">
        <colgroup><col class="c-prop"><col><col><col class="c-mark"></colgroup>
        <thead><tr><th>Property</th><th>Declared<small>Git · ${esc(def.file.split("/").pop())}</small></th><th>Observed<small>what is running</small></th><th>Match</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </div>
    <aside class="side" id="side"></aside>
  </div>`;

const tbody = main.querySelector("#rows");
let state = { filter: "all", open: new Set() };
(() => { // From the hash: #only=diff&open=r12
  const p = new URLSearchParams(location.hash.slice(1));
  state.filter = p.get("only") === "diff" ? "diff" : "all";
  if (p.get("open")) p.get("open").split(",").forEach((id) => state.open.add(id));
  else { const first = ROWS.find((r) => r.mark === "differs") ?? ROWS.find(isDiff); if (first) state.open.add(first.id); }
})();
function saveHash() {
  const p = new URLSearchParams();
  if (state.filter === "diff") p.set("only", "diff");
  if (state.open.size) p.set("open", [...state.open].join(","));
  history.replaceState(null, "", `${location.pathname}${location.search}${p.toString() ? `#${p}` : ""}`);
}

function renderRows() {
  main.querySelectorAll("[data-filter]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.filter === state.filter));
  const html = GROUPS.map((g) => {
    const rows = g.rows.filter((r) => state.filter === "all" || isDiff(r));
    if (!rows.length) return "";
    const s = sec(g.id);
    return `<tr class="grp"><td colspan="4"><div class="grp__in"><span class="grp__title">${icon(g.icon ?? s?.icon ?? "circleDot", 15)}${esc(g.title ?? s?.title)}</span><span class="grp__src">${g.src ? `observed from ${esc(g.src)}` : "nothing to observe"}</span></div></td></tr>`
      + rows.map((r) => {
        const open = state.open.has(r.id);
        return `<tr class="r${open ? " is-open" : ""}" data-mark="${r.mark}" data-row="${r.id}">
          <td><button type="button" class="prop" aria-expanded="${open}" aria-controls="x-${r.id}">${icon("chevronRight", 14)}<span style="min-width:0"><span>${esc(r.label)}</span>${r.key && r.key.toLowerCase() !== r.label.toLowerCase() ? `<span class="prop__key truncate" title="${esc(r.key)}">${esc(r.key)}</span>` : ""}</span></button></td>
          <td class="val">${r.declared}</td>
          <td class="val">${r.observed}</td>
          <td>${MARK[r.mark]()}</td></tr>
          ${open ? `<tr class="x" id="x-${r.id}"><td colspan="4">${expansion(r)}</td></tr>` : ""}`;
      }).join("");
  }).join("");
  tbody.innerHTML = html || `<tr class="empty"><td colspan="4">${icon("circleCheck", 18)}<br>Nothing differs. Declared and observed agree.</td></tr>`;
}
main.addEventListener("click", (e) => {
  const f = e.target.closest("[data-filter]");
  if (f) { state.filter = f.dataset.filter; renderRows(); saveHash(); return; }
  if (e.target.closest("button:not(.prop), a")) return;
  const tr = e.target.closest(".r");
  if (!tr) return;
  const id = tr.dataset.row;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  renderRows(); saveHash();
  main.querySelector(`[data-row="${id}"] .prop`)?.focus();
});

// ---- The narrow column: what is not a comparison --------------------------------------------
function side() {
  const p = res.policy;
  const policy = `<section><h2>Policy</h2><ul class="side__list">
    <li><span>Approval</span>${RD.badge(p.approval, p.approval === "manual" ? "attention" : "neutral")}</li>
    ${p.actions.map((a) => `<li><span class="mono small">${esc(a.action)}</span>${RD.badge(a.approval, "neutral")}</li>`).join("")}
    <li><span>Destructive</span>${RD.badge(p.destructive, "attention")}<span class="side__sub">Set by ${esc(p.approvalSetBy)}</span></li></ul></section>`;
  const runs = `<section><h2 class="row row--between"><span>${kind === "node" ? "Runs of its guests" : "Runs"}</span><a href="#" class="small">All</a></h2><ul class="side__list">${res.runs.slice(0, 5).map((r) => `
    <li><span class="truncate"><span class="dot" data-tone="${RD.tone(r.status)}"></span> <a href="#">#${r.number}</a> ${esc(r.title)}</span><span class="xs muted">${RD.rel(r.createdAt)}</span>
      <span class="side__sub truncate">${kind === "node" ? `${esc(r.address.split("/").pop())} · ` : ""}${esc(r.detail ?? "")}</span></li>`).join("")}</ul></section>`;
  const extra = {
    machine: () => `<section><h2>Services on it</h2><ul class="side__list">${res.services.map((s) => `<li><span class="truncate">${RD.svcIcon(s.name)} <a href="${RD.href("service")}">${esc(s.name)}</a></span><span class="dot" data-tone="${RD.tone(s.status)}" title="${RD.statusLabel(s.status)}"></span></li>`).join("")}</ul></section>`,
    service: () => `<section><h2>Stages</h2><ul class="side__list">${res.workflow.stages.map((s) => `<li><span class="mono small">${esc(s.name)}</span>${RD.chip(s.executor)}</li>`).join("")}</ul></section>`,
    node: () => `<section><h2>Trust</h2><ul class="side__list"><li><span>Trusted</span><span class="small muted">${esc(res.trust.trustedBy)}, ${RD.rel(res.trust.trustedAt)}</span></li><li><span>Snippets key</span><span class="mono xs truncate" style="max-width:8rem">${esc(res.snippets.fingerprint.slice(0, 16))}…</span></li></ul></section>`,
  }[kind]();
  return `${policy}${extra}${runs}<section><button type="button" class="button" data-yaml="" style="width:100%">${icon("code", 15)}View the YAML</button></section>`;
}
main.querySelector("#side").innerHTML = side();
renderRows();
</script>
</body>
</html>
