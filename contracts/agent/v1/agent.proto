// The contract between the Octopushy backend and its agents.
//
// Agents connect outbound to the agent endpoint, which serves gRPC over TLS with a
// certificate issued by the server's agent CA. Before enrolling, the agent fetches
// that CA from `GET /agent/ca.pem` on the same endpoint and checks its SHA-256
// fingerprint against the one in its enrollment token; from then on it trusts only
// that CA. Enrollment needs no client certificate; AgentChannel requires the one
// issued at enrollment.
syntax = "proto3";

package octopushy.agent.v1;

option csharp_namespace = "Octopushy.Agent.V1";

service Enrollment {
  // Exchanges a one-time enrollment token and a certificate request for the
  // agent's certificate.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

service AgentChannel {
  // One long-lived stream per agent. The agent sends Hello first.
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);

  // Issues a new certificate for a new key before the current one expires.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // Sends the image a "nix" "build" attempt of this agent made, in chunks. Images are too big
  // for one message, so they never travel as an Artifact. See docs/built-templates.md.
  rpc UploadImage(stream ImageChunk) returns (ImageUploaded);

  // Fetches an image an attempt assigned to this agent names in its input, in chunks.
  rpc DownloadImage(DownloadImageRequest) returns (stream ImageChunk);
}

// One piece of an image. The first chunk of an upload carries attempt_id, file_name and
// size; every chunk carries data, at most 4 MiB; the last carries sha256, the lowercase hex
// SHA-256 of the whole file. A download's chunks carry the same, file_name and size first.
message ImageChunk {
  string attempt_id = 1;
  string file_name = 2;
  uint64 size = 3;
  bytes data = 4;
  string sha256 = 5;
}

message ImageUploaded {
  string sha256 = 1;
  uint64 size = 2;
}

message DownloadImageRequest {
  // An attempt assigned to the calling agent, whose input names this image.
  string attempt_id = 1;
  string sha256 = 2;
}

message EnrollRequest {
  // The secret part of the enrollment token.
  string token = 1;
  // The name the agent asks to be shown as, usually its hostname.
  string name = 2;
  // PKCS#10 certificate request for a key the agent generated itself.
  bytes csr_der = 3;
  string agent_version = 4;
}

message EnrollResponse {
  string agent_id = 1;
  bytes certificate_der = 2;
  bytes ca_certificate_der = 3;
}

message RenewCertificateRequest {
  bytes csr_der = 1;
}

message RenewCertificateResponse {
  bytes certificate_der = 1;
}

message AgentMessage {
  oneof kind {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    AttemptStarted started = 3;
    AttemptLog log = 4;
    AttemptResult result = 5;
    AttemptStateSnapshot state_snapshot = 6;
    // Added in reachability-v1. Never in the result outbox: a report lost with a connection is
    // simply not evidence, and the server asks again.
    ReachabilityReport reachability = 7;
  }
}

message Hello {
  string agent_version = 1;
  // Executors this binary provides, such as "opentofu" and "proxmox".
  repeated string executors = 2;
  // Attempts still executing, for example after a reconnect.
  repeated string running_attempt_ids = 3;
  // How the agent runs tools: "podman", "docker", or "local".
  string tool_runtime = 4;
  // Features of this binary that are not executors, such as
  // "opentofu-builtin-state" or "reachability-v1". Older agents send none.
  repeated string capabilities = 5;
}

message Heartbeat {
  repeated string running_attempt_ids = 1;
}

message AttemptStarted {
  string attempt_id = 1;
}

message AttemptLog {
  string attempt_id = 1;
  // Sequence number of the first line; lines are numbered from 0 per attempt, so
  // the server can drop lines it already has after a reconnect.
  uint64 first_sequence = 2;
  repeated LogLine lines = 3;
}

message LogLine {
  int64 unix_ms = 1;
  LogStream stream = 2;
  // Secret values from the assignment are already masked.
  string text = 3;
}

enum LogStream {
  LOG_STREAM_UNSPECIFIED = 0;
  LOG_STREAM_STDOUT = 1;
  LOG_STREAM_STDERR = 2;
  // Lines the agent writes itself, such as which command it is starting.
  LOG_STREAM_AGENT = 3;
}

message AttemptResult {
  string attempt_id = 1;
  Outcome outcome = 2;
  // Executor-specific JSON object.
  string outputs_json = 3;
  // Why the attempt did not succeed, for people to read.
  string error = 4;
  repeated Artifact artifacts = 5;
}

// OpenTofu's state while an apply runs, so a lost machine loses little. The newest
// snapshot replaces earlier ones of the attempt; the final state comes with the result.
message AttemptStateSnapshot {
  string attempt_id = 1;
  Artifact state = 2;
}

enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_SUCCEEDED = 1;
  OUTCOME_FAILED = 2;
  // The agent cannot tell whether the mutation happened, for example because it
  // restarted while an apply was running.
  OUTCOME_UNCERTAIN = 3;
  OUTCOME_CANCELLED = 4;
}

message Artifact {
  string name = 1;
  bytes content = 2;
  // Lowercase hex SHA-256 of content.
  string sha256 = 3;
}

message ServerMessage {
  oneof kind {
    Welcome welcome = 1;
    Assignment assignment = 2;
    CancelAttempt cancel = 3;
    ResultAck result_ack = 4;
    // Sent only to an agent whose Hello lists the capability "reachability-v1".
    ReachabilityProbe probe = 5;
  }
}

message Welcome {
  string agent_id = 1;
  uint32 max_concurrency = 2;
  uint32 heartbeat_seconds = 3;
}

message Assignment {
  string attempt_id = 1;
  // "opentofu", "ansible", "proxmox" or "nix".
  string executor = 2;
  // Executor-specific, such as "preview", "apply", "observe", "verify-guest".
  string action = 3;
  // Executor-specific JSON object.
  string input_json = 4;
  // Secrets resolved for this attempt only, by name. Never logged.
  map<string, string> secrets = 5;
  // Repository files the attempt needs, such as an OpenTofu root, as a gzip tar.
  bytes files_tar_gz = 6;
  // Outputs of earlier steps, such as a saved plan.
  repeated Artifact artifacts = 7;
  uint32 lease_seconds = 8;
}

message CancelAttempt {
  string attempt_id = 1;
}

message ResultAck {
  string attempt_id = 1;
}

// Asks whether this agent can open a connection to one endpoint, from the context a step
// would connect from. Credential-free: the agent sends no token, key or CA, and a positive
// answer is recent route and protocol evidence, not proof that a step will succeed.
// See docs/worker-routing.md.
message ReachabilityProbe {
  // Chosen by the server; a report is accepted only for an outstanding ID of the same
  // session. Letters, digits and '-', at most 64.
  string probe_id = 1;
  // "tls": a TLS handshake. "ssh": the server's SSH identification line. Nothing is
  // authenticated and nothing is sent after the handshake or the banner.
  string protocol = 2;
  // A DNS name or an IP address, without brackets.
  string host = 3;
  uint32 port = 4;
  // TLS only: the name presented and verified. Empty: host.
  string server_name = 5;
  // TLS only. "system": verified with the agent's trust store, as the proxmox executor
  // does with verifyTls and no CA. "collect": any certificate, but the handshake
  // signature is still verified; the presented chain goes back for the server to judge.
  string tls_trust = 6;
  // "agent": the agent process itself, as the proxmox executor connects.
  // "tool": as the tool runtime starts OpenTofu or Ansible.
  string context = 7;
  // "tool" context with a container runtime: the image the step runs, whose container
  // makes the connection. Ignored by the local runtime.
  string image = 8;
  // The whole probe, including starting a container. The agent caps it.
  uint32 timeout_seconds = 9;
}

message ReachabilityReport {
  string probe_id = 1;
  // "reachable", "refused", "timeout", "dns", "unreachable", "protocol" (something else
  // answered), "tls-untrusted", "unsupported" (this context cannot be probed faithfully,
  // such as through a proxy), or "error".
  string status = 2;
  // For people, written by the agent, at most 300 characters. Never peer data beyond an
  // SSH protocol version, never a credential.
  string detail = 3;
  // "collect" only: the presented chain, leaf first, DER. At most 8, each at most 16 KiB.
  repeated bytes certificates = 4;
  uint32 elapsed_ms = 5;
}
