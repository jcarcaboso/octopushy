# The control host: PostgreSQL, the backend, and the frontend. Agents run elsewhere (or on
# this host under their own user) and connect to the agent port; the `agent` profile adds
# an internal agent to this project. See deploy/README.md.
name: octopushy

services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: octopushy
      POSTGRES_DB: octopushy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "octopushy", "-d", "octopushy"]
      interval: 5s
      retries: 20

  # Applies database migrations, then exits; the backend starts only after it succeeds.
  migrate:
    image: ${OCTOPUSHY_BACKEND_IMAGE:-localhost/octopushy-backend:dev}
    command: ["migrate"]
    environment:
      ConnectionStrings__Octopushy: Host=postgres;Database=octopushy;Username=octopushy;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${OCTOPUSHY_BACKEND_IMAGE:-localhost/octopushy-backend:dev}
    restart: unless-stopped
    environment:
      ConnectionStrings__Octopushy: Host=postgres;Database=octopushy;Username=octopushy;Password=${POSTGRES_PASSWORD}
      Octopushy__TrustForwardedHeaders: "true"
      Octopushy__Store__KeyFile: /run/secrets/kek
      # The name or address agents use to reach this host; it goes into the agent endpoint's certificate.
      Octopushy__AgentChannel__Hostnames__0: ${OCTOPUSHY_AGENT_HOST:?set OCTOPUSHY_AGENT_HOST in .env}
      # The name the internal agent uses on the agents network.
      Octopushy__AgentChannel__Hostnames__1: backend
      Octopushy__AgentChannel__PublicUrl: https://${OCTOPUSHY_AGENT_HOST}:${OCTOPUSHY_AGENT_PORT:-8443}
      # Post-provision one-shot guest reporter; publish a compatible, pinned binary first.
      Octopushy__DiskReporter__Enabled: ${OCTOPUSHY_DISK_REPORTER_ENABLED:-false}
      Octopushy__DiskReporter__PublicUrl: ${OCTOPUSHY_DISK_REPORTER_PUBLIC_URL:-}
      Octopushy__DiskReporter__BinaryUrl: ${OCTOPUSHY_DISK_REPORTER_BINARY_URL:-}
      Octopushy__DiskReporter__BinarySha256: ${OCTOPUSHY_DISK_REPORTER_BINARY_SHA256:-}
      Octopushy__DiskReporter__IntervalSeconds: ${OCTOPUSHY_DISK_REPORTER_INTERVAL_SECONDS:-3600}
      Octopushy__DiskReporter__CaCertificatePem: ${OCTOPUSHY_DISK_REPORTER_CA_PEM:-}
    secrets:
      - kek
    volumes:
      - data:/var/lib/octopushy
    networks: [default, agents]
    ports:
      # Agents connect here: gRPC over TLS with client certificates.
      - "${OCTOPUSHY_AGENT_PORT:-8443}:8443"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ${OCTOPUSHY_FRONTEND_IMAGE:-localhost/octopushy-frontend:dev}
    restart: unless-stopped
    environment:
      OCTOPUSHY_BACKEND: backend:8080
    ports:
      # The web interface. It listens on localhost by default; put TLS in front before exposing it.
      - "${OCTOPUSHY_UI_BIND:-127.0.0.1}:${OCTOPUSHY_UI_PORT:-8081}:8081"
    depends_on:
      - backend

  # The internal agent (profile `agent`): runs OpenTofu and the Proxmox checks from this
  # host. It shares only the agents network with the backend, so it cannot reach
  # PostgreSQL, and it gets neither the key nor the database password. It waits until it
  # is enrolled: `docker compose run --rm -e OCTOPUSHY_ENROLLMENT_TOKEN agent agent enroll
  # --server https://backend:8443 --name internal`, with the token from the web interface.
  agent:
    image: ${OCTOPUSHY_AGENT_IMAGE:-localhost/octopushy-agent:dev}
    profiles: [agent]
    restart: unless-stopped
    # Reaps the processes OpenTofu leaves behind and forwards signals to the agent.
    init: true
    # The first SIGTERM lets running applies finish; never cut one short.
    stop_grace_period: 30m
    volumes:
      - agent:/var/lib/octopushy-agent
    networks: [agents]
    depends_on:
      - backend

networks:
  default:
  agents:

secrets:
  # The key-encryption key for the variable store: 32 random bytes, kept out of backups.
  kek:
    file: ${OCTOPUSHY_KEK_FILE:-./secrets/kek}

volumes:
  postgres:
  data:
  agent:
