[workspace]
resolver = "3"
members = [
    "crates/proto",
    "crates/proxmox",
    "crates/octopushy",
    "crates/mock-proxmox",
    "crates/disk-reporter",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
octopushy-proto = { path = "crates/proto" }
octopushy-proxmox = { path = "crates/proxmox" }
mock-proxmox = { path = "crates/mock-proxmox" }

# Async runtime and gRPC
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "process", "signal"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
futures = "0.3"
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
protox = "0.10"

# HTTP
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rustls-platform-verifier = "0.7"
hyper = "1"
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "form", "tokio"] }
url = "2"

# Certificates
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
x509-parser = "0.18"

# Serialization and utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
tar = { version = "0.4", default-features = false }
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
fastrand = "2"
libc = "0.2"

# Tests
wiremock = "0.6"
tempfile = "3"
tower = "0.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
